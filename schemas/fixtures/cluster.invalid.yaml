# INTENTIONALLY INVALID cluster.yaml — negative fixture for lint-cluster-yaml.sh
# (issue #136 Task 3; issue #169 added the four kernel-arg lexical-rule
# violations). Valid in every respect EXCEPT eleven offending entries binding
# TWELVE schema rules red-green — entry 10 breaks two rules at once, and CI
# asserts all twelve are named in the output, one needle per rule:
#   0. nodes key CP_2 — uppercase + underscore; a name Talos ACCEPTS and then
#      silently rewrites, so the schema rejects what the platform would rewrite.
#   1. node role: master — violates the node.role enum (controlplane | worker).
#   2. talos.install_version: v1.13.9.4 — trailing garbage after the PATCH
#      segment; violates the fully anchored version pattern (the former
#      start-anchored pattern accepted this value).
#   3. images.bad-karg-whitespace.extra_kernel_args[0] — a space smuggles a
#      second arg past the module's =-keyed conflict guard (rule W).
#   4. images.bad-karg-removal.extra_kernel_args[0] — the karg removal
#      spelling, a Non-Goal the guard cannot see (rule D).
#   5. images.bad-karg-empty-key.extra_kernel_args[0] — the empty string, which
#      the Factory would receive as extraKernelArgs: [""] (rule E).
#   6. images.bad-karg-debugfs.extra_kernel_args[0] — the debugfs KEY at a
#      NON-forbidden value (rule B matches the key, not the literal AGENTS.md
#      §Hard Constraints value; this file is outside hard-constraints-check.yml's
#      kubernetes/**+tofu/** glob regardless).
#   7. substrate.cilium.agent_metric_overrides[0] — an embedded newline (rule M).
#   8. substrate.cilium.hubble_metrics[1] — a document separator (rule H).
#   9. substrate.cilium.native_routing_cidr — an embedded newline (rule C). The
#      third input reaching the same raw-rendered cilium-config document.
#  10. substrate.cilium.operator_replicas: 0.5 — violates BOTH conjuncts of the
#      schema mirror at once (`type: integer` and `minimum: 1`), so each is bound
#      by its own CI needle. A single-conjunct value would leave the other free
#      to be relaxed with the step still green, since the needles match the
#      linter's distinct messages rather than the bare path.
#  11. cluster.worker_apply_mode: staged_if_needing_reboot — a real provider mode
#      the module deliberately does NOT accept: the pinned provider offers it but
#      resolves it to "auto" on Talos 1.14+, the line the pin exists to reach. The
#      enum is the only thing keeping it out.
# Relax any rule in schemas/cluster.schema.json and the negative CI step turns
# red. Not a runnable cluster — RFC5737 documentation IPs; no node references
# the four new images (check-jsonschema has no cross-reference check).
cluster:
  name: bad-cluster
  endpoint: https://bad-cluster-api.example.com:6443
  worker_apply_mode: staged_if_needing_reboot
repo:
  url: https://github.com/example/bad-cluster.git
talos:
  version: v1.13.9
  install_version: v1.13.9.4 # INVALID: trailing garbage after the PATCH segment
kubernetes:
  version: v1.36.3
images:
  standard:
    architecture: amd64
    cpu_vendor: intel
    extensions: []
  bad-karg-whitespace:
    architecture: amd64
    cpu_vendor: intel
    extra_kernel_args: ["hugepagesz=1G intel_iommu=off"] # INVALID: rule W (whitespace)
  bad-karg-removal:
    architecture: amd64
    cpu_vendor: intel
    extra_kernel_args: ["-intel_iommu"] # INVALID: rule D (removal spelling)
  bad-karg-empty-key:
    architecture: amd64
    cpu_vendor: intel
    extra_kernel_args: [""] # INVALID: rule E (empty key)
  bad-karg-debugfs:
    architecture: amd64
    cpu_vendor: intel
    extra_kernel_args: ["debugfs=on"] # INVALID: rule B (debugfs key, non-forbidden value)
nodes:
  cp-1:
    ip: 192.0.2.11
    role: master # INVALID: schema enum is controlplane | worker
    image: standard
    hardware_capabilities: []
  # INVALID: non-canonical node key. Talos would ACCEPT this hostname (its
  # validation is length-only) and silently rewrite it to "cp-2" on the way to
  # Kubernetes — so the declared name and the live name would differ.
  CP_2:
    ip: 192.0.2.12
    role: controlplane
    image: standard
    hardware_capabilities: []
substrate:
  cilium:
    # INVALID: rule M — an embedded newline in a metric-override entry. The chart
    # renders these raw and unquoted into cilium-config, so the second line
    # becomes a standalone ConfigMap key in the create-only machine config.
    agent_metric_overrides: ["+ok\n  injected-key: pwned"]
    # INVALID: rule H — a document separator in a Hubble metric entry. Same raw
    # render, plus outputs.tf splits the rendered manifest on that boundary.
    hubble_metrics: ["dns", "drop---evil"]
    # INVALID: rule C — an embedded newline in the native-routing CIDR. The chart
    # writes `ipv4-native-routing-cidr: {{ . }}` raw and unquoted, so the second
    # line becomes a standalone ConfigMap key in the create-only machine config.
    native_routing_cidr: "10.244.0.0/16\n  injected-native-key: pwned"
    # INVALID twice over: fractional (violates `type: integer`) AND below
    # `minimum: 1`. Mirrors the module's own two validation conjuncts so the
    # declarative path rejects both at lint time, not only at plan time.
    operator_replicas: 0.5
