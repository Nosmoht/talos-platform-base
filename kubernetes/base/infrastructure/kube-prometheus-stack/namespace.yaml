apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/managed-by: argocd
    platform.io/network-interface-version: v1
    platform.io/network-profile: managed
    # kube-prometheus-stack is the SOLE owner of the monitoring namespace.
    # Reason: kps is the primary tenant (Prometheus + Grafana +
    # Alertmanager + dashboards) and ships the monitoring-scrape and
    # logging-ship capability labels — the namespace is the trust anchor
    # for both. loki and alloy deploy INTO this namespace as secondary
    # tenants; they do not ship namespace.yaml. See ADR
    # adr-namespace-ownership-rendered-manifests.md §"A single
    # Application owns each namespace".
    platform.io/provide.logging-ship: "true"
    platform.io/provide.monitoring-scrape: "true"
    # node-exporter daemonset (shipped by kps) requires hostNetwork+hostPID —
    # privileged enforce.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
