apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/managed-by: argocd
    platform.io/network-interface-version: v1
    platform.io/network-profile: managed
    # kube-prometheus-stack and loki co-own the monitoring namespace.
    # Both produce capabilities here; the namespace is the trust anchor.
    # See ADR §Namespace-anchored producer trust.
    platform.io/provide.logging-ship: "true"
    platform.io/provide.monitoring-scrape: "true"
    # monitoring namespace is co-owned by alloy, kube-prometheus-stack,
    # loki. node-exporter daemonset requires hostNetwork+hostPID —
    # privileged enforce. All three co-owner namespace.yaml copies
    # stay identical so whichever ArgoCD app applies last produces a
    # consistent label set.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
