apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/managed-by: argocd
    platform.io/network-interface-version: v1
    platform.io/network-profile: managed
    # vault-operator + vault-config-operator co-own the vault namespace.
    # Operator pods carry capability-provider.monitoring-scrape (/metrics)
    # and capability-provider.admission-webhook (ValidatingAdmissionWebhooks
    # for their CRDs). Trust anchor — see ADR
    # adr-capability-producer-consumer-symmetry.md §Namespace-anchored
    # producer trust. Kept identical to vault-operator/namespace.yaml so
    # whichever ArgoCD app applies last produces a consistent label set.
    platform.io/provide.monitoring-scrape: "true"
    platform.io/provide.admission-webhook: "true"
    # vault namespace is co-owned by vault-operator + vault-config-operator.
    # Baseline enforce required because vault server (bank-vaults) needs
    # IPC_LOCK. Both co-owner copies stay identical so whichever ArgoCD
    # app applies last produces a consistent label set.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
