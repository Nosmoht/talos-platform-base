apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/managed-by: argocd
    platform.io/network-interface-version: v1
    platform.io/network-profile: managed
    # vault-operator is the SOLE owner of the vault namespace.
    # Reason: vault-operator runs the vault server (the namespace's
    # primary tenant) and ships both monitoring-scrape (/metrics) and
    # admission-webhook capabilities here — the namespace is the trust
    # anchor for both. vault-config-operator deploys INTO this namespace
    # as a secondary tenant; it does not ship namespace.yaml. See ADR
    # adr-namespace-ownership-rendered-manifests.md §"A single
    # Application owns each namespace".
    platform.io/provide.monitoring-scrape: "true"
    platform.io/provide.admission-webhook: "true"
    # bank-vaults vault-operator pod runs under baseline PSA (vault server
    # needs IPC_LOCK capability for mlock).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
