# invalid-hw-arch-mismatch.yaml — triggers:
# FAIL [n.pi-01]: hardware-platform 'raspberry-pi-4' not compatible with arch 'amd64'
roles:
  worker:
    description: "Worker node"

architectures:
  amd64:
    talos-arch: amd64
    compatible-infrastructure-platforms:
      - metal
    compatible-hardware-platforms:
      - intel-generic

infrastructure-platforms:
  metal:
    installer-profile: metal

hardware-platforms:
  raspberry-pi-4:
    vendor: Raspberry Pi Foundation
    model: Raspberry Pi 4

hardware-capabilities:
  base-server:
    description: "Standard compute"
    requires_features:
      - nvidia-gpu

nodes:
  - name: pi-01
    role: worker
    arch: amd64
    infrastructure-platform: metal
    hardware-platform: raspberry-pi-4
    hardware-capabilities:
      - base-server
    ip: 192.0.2.41
    nic: eth0
