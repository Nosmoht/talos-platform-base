# invalid-infra-arch-mismatch.yaml — triggers:
# FAIL [n.pi-01]: infrastructure-platform 'vmware' not compatible with arch 'arm64'
roles:
  worker:
    description: "Worker node"

architectures:
  arm64:
    talos-arch: arm64
    compatible-infrastructure-platforms:
      - metal
      - nocloud

infrastructure-platforms:
  vmware:
    installer-profile: vmware

hardware-platforms:
  raspberry-pi-4:
    vendor: Raspberry Pi Foundation
    model: Raspberry Pi 4

hardware-capabilities:
  arm-sbc:
    description: "ARM SBC"
    requires_features:
      - nvidia-gpu

nodes:
  - name: pi-01
    role: worker
    arch: arm64
    infrastructure-platform: vmware
    hardware-platform: raspberry-pi-4
    hardware-capabilities:
      - arm-sbc
    ip: 192.0.2.41
    nic: eth0
