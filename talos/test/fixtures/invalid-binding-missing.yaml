# invalid-binding-missing.yaml — triggers binding-missing FAIL diagnostic:
# FAIL [n.missing-binding]: binding-missing — capability 'kubevirt-networking' references
#   placeholder '${NIC_NAME}' but nodes/missing-binding.yaml is missing the binding
#   (expected at path 'machine.network.bridge.nic')
#
# The node file talos/test/fixtures/nodes/missing-binding.yaml intentionally
# omits the machine.network.bridge.nic field to trigger the diagnostic.

roles:
  worker:
    description: "Kubernetes worker node"

architectures:
  amd64:
    talos-arch: amd64
    compatible-infrastructure-platforms:
      - metal

infrastructure-platforms:
  metal:
    installer-profile: metal

hardware-platforms:
  intel-generic:
    vendor: Intel
    model: "Generic x86-64"

hardware-capabilities:
  kubevirt-networking:
    description: "KubeVirt VM networking via VLAN + Linux bridge (requires NIC binding)"
    placeholder_bindings:
      NIC_NAME: machine.network.bridge.nic
    patches:
      - file: patches/worker-kubevirt.yaml

nodes:
  - name: missing-binding
    role: worker
    arch: amd64
    infrastructure-platform: metal
    hardware-platform: intel-generic
    hardware_capabilities:
      - kubevirt-networking
    ip: 10.0.0.21
    nic: eth0
