  intel-generic:
    vendor: Intel
    model: "Generic x86-64"

hardware-capabilities:
  base-server:
    description: "Standard compute"
    requires_features:
      - nvidia-gpu

nodes:
  - name: cp-01
    role: controlplane
    arch: amd64
    infrastructure-platform: metal
    hardware-platform: intel-generic
    hardware_capabilities:
      - base-server
      - nonexistent-cap
    ip: 192.0.2.11
    nic: eth0
