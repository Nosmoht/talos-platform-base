# invalid-hw-not-in-infra.yaml — triggers:
# FAIL [n.cp-01]: hardware-platform 'raspberry-pi-4' not in compatible-infrastructure-platforms of 'vmware'
roles:
  controlplane:
    description: "Control-plane node"

architectures:
  amd64:
    talos-arch: amd64
    compatible-infrastructure-platforms:
      - vmware

infrastructure-platforms:
  vmware:
    installer-profile: vmware
    compatible-hardware-platforms:
      - intel-generic

hardware-platforms:
  raspberry-pi-4:
    vendor: Raspberry Pi Foundation
    model: Raspberry Pi 4

hardware-capabilities:
  base-server:
    description: "Standard compute"
    requires_features:
      - nvidia-gpu

nodes:
  - name: cp-01
    role: controlplane
    arch: amd64
    infrastructure-platform: vmware
    hardware-platform: raspberry-pi-4
    hardware_capabilities:
      - base-server
    ip: 192.0.2.11
    nic: eth0
