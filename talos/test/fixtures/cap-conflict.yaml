# cap-conflict.yaml — triggers WARN (default, no strict flag):
# WARN [conflict]: capability 'cap-a' and 'cap-b' patch the same pointer '/machine/install/disk'
roles:
  controlplane:
    description: "Control-plane node"

architectures:
  amd64:
    talos-arch: amd64
    compatible-infrastructure-platforms:
      - metal

infrastructure-platforms:
  metal:
    installer-profile: metal

hardware-platforms:
  intel-generic:
    vendor: Intel
    model: "Generic x86-64"

hardware-capabilities:
  cap-a:
    description: "Capability A — patches install disk"
    requires_features:
      - nvidia-gpu
    patches:
      - pointer: /machine/install/disk
        value: /dev/sda

  cap-b:
    description: "Capability B — also patches install disk (conflict)"
    requires_features:
      - nvidia-gpu
    patches:
      - pointer: /machine/install/disk
        value: /dev/nvme0n1

nodes:
  - name: cp-01
    role: controlplane
    arch: amd64
    infrastructure-platform: metal
    hardware-platform: intel-generic
    hardware-capabilities:
      - cap-a
      - cap-b
    ip: 192.0.2.11
    nic: eth0
