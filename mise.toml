# Single source of every binary tool version (ADR-0030). CI installs from this
# file through jdx/mise-action; locally run `mise install`. Bump a version here,
# then run `mise lock` and commit both files.
#
# Not here: envsubst (GNU gettext — the mise envsubst lacks the SHELL-FORMAT
# argument Taskfile.yml passes), python3 (system; the scripts are stdlib-only),
# the npm tools (package-lock.json), and the release-only tools in
# oci-publish.yml / release.yml.

[settings]
locked = true

[tools]
"aqua:helm/helm" = "4.3.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.3"
"aqua:open-policy-agent/conftest" = "0.71.1"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:opentofu/opentofu" = "1.12.8"
"aqua:terraform-linters/tflint" = "0.64.0"
"aqua:go-task/task" = "3.54.0"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:vale-cli/vale" = "3.24.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:lycheeverse/lychee" = "0.24.2"
"github:openknowledge-sh/openknowledge" = "0.13.0"
node = "22.23.3"
