# Taskfile for talos-platform-base — the single task runner for the substrate base.
# https://taskfile.dev
#
# Scope: this Taskfile is the SOLE runner for the repository. The Makefile was
# retired at v3.0.0 (see knowledge/decisions/0012-makefile-retirement.md); every former target
# folds into a namespaced task here:
#
#   tofu:*         — OpenTofu cluster-lifecycle module (tofu/) validation
#   gitops:*       — kustomize manifest validation + rendered-manifests pipeline
#   bootstrap:*    — consumer App-of-Apps root seed (NOT module-delivered)
#   cluster:*      — declarative cluster SoT (cluster.yaml) init
#   supply-chain:* — OCI tarball allowlist verification
#   mcp:*          — MCP server binary management
#   dev:*          — contributor hygiene (pre-commit, tool pins)
#
# Run `task --list` for the full target list with descriptions.

version: '3'

# Convention (mirrors talos-platform-apps): silent tasks — only the commands
# themselves write to the console, not their own invocation echo.
silent: true

env:
  # openspec bundles a posthog-node telemetry client (anonymous command+version;
  # auto-disabled when CI=true, verified in its dist/telemetry/index.js).
  # Explicit opt-out keeps LOCAL task runs network-quiet too.
  OPENSPEC_TELEMETRY: "0"

vars:
  # Declarative cluster SoT consumed by bootstrap:* (override per invocation:
  # `task bootstrap:argocd ENV=other.yaml`).
  ENV: cluster.yaml
  # Module directories (one per module) — the tofu:* targets iterate these.
  # NOT terraform-docs-generated: no module README carries BEGIN_TF_DOCS
  # markers, so their tables are hand-maintained (see tofu:docs).
  TOFU_MODULES:
    sh: find tofu/modules -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort
  # MCP server versions — pinned to verified official sources
  # (homebrew/core, containers/k8s, npm/talos-mcp).
  MCP_GITHUB_VERSION: 0.33.0
  MCP_K8S_VERSION: 0.0.60
  MCP_TALOS_VERSION: 1.1.0
  # knowledge:* tool pins — KEEP IN SYNC with .tool-versions. NOT with the
  # docs-lint.yml env block: that pins only `task`, and these two reach CI
  # through `task knowledge:install-cli`. Checksums from the projects'
  # released checksum files (openknowledge verified 2026-08-23, lychee
  # 2026-07-11).
  OPENKNOWLEDGE_VERSION: 0.12.0
  OPENKNOWLEDGE_SHA256_DARWIN_ARM64: 24e5fe37f87dae647121b98dc708997206906558413b7620617f0a8690da0e1d
  OPENKNOWLEDGE_SHA256_DARWIN_AMD64: 8f20fe1c09c7ac69124f020f219f1d9b61c92aaac6bb156704b8886a38bed2aa
  OPENKNOWLEDGE_SHA256_LINUX_AMD64: 614e317499eb29f8367edbba78b4c81a1a7c895c3203c5b9ef861a9b1875f108
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256_DARWIN_ARM64: c9d3740ea2d891854d37116c9fba840f37b6e7c89d330e7db84ac333631c4977
  LYCHEE_SHA256_DARWIN_AMD64: 887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978
  LYCHEE_SHA256_LINUX_AMD64: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
  # spec:*/docs:* tool pins (openspec, markdownlint-cli) live in
  # package.json + package-lock.json — installed via `npm ci
  # --ignore-scripts`. Scope of the control: the lockfile's integrity
  # hashes pin the FETCH to the reviewed lockfile (registry/MITM
  # tampering); they do not vouch for the lockfile's own content —
  # lockfile diffs stay review surface. `task dev:verify-pins` asserts
  # package.json ↔ .tool-versions plus registry-host provenance of every
  # resolved URL; --ignore-scripts disables lifecycle scripts.
  # Rule set rendered into AGENTS.md's managed block. Single source for both
  # knowledge:rules-apply and knowledge:rules-check — a divergence between the
  # two would make the fence prescribe a regeneration that drops content.
  # NOT [rules].enabled in .openknowledge.toml: whether a no-argument
  # `prompt rules apply` falls back to it is undocumented (the CLI help
  # contradicts itself), and a wrong guess renders the custom rule away.
  OK_RULES: docs,decisions,schemas,talos-base-bundle
  # Both rules targets render with whatever openknowledge is on PATH. Pinning
  # the version here matters more than for validate: a mismatched binary
  # renders a different block, and the fence's own advice ("regenerate") would
  # then rewrite AGENTS.md with it.
  OK_GUARD: |
    command -v openknowledge >/dev/null 2>&1 || { echo "ERROR: 'openknowledge' not installed — run 'task knowledge:install-cli'"; exit 1; }
    # Normalize the same way scripts/verify-tools.sh does — it strips a leading
    # "v" from this exact command, and two checks of one value must not
    # disagree on the format.
    have="$(openknowledge version 2>/dev/null | head -n1 | tr -d '[:space:]' | sed -E 's/^v//')"
    [ "$have" = "{{.OPENKNOWLEDGE_VERSION}}" ] || { echo "ERROR: openknowledge '$have' != pinned '{{.OPENKNOWLEDGE_VERSION}}' — run 'task knowledge:install-cli' (and check PATH order)"; exit 1; }

tasks:
  default:
    desc: List available targets
    cmd: task --list

  # ===========================================================================
  # tofu:* — OpenTofu cluster-lifecycle module (tofu/)
  # ===========================================================================
  tofu:fmt:
    desc: Rewrite all tofu/ files to canonical format
    cmd: tofu fmt -recursive tofu/

  tofu:fmt:check:
    desc: Verify tofu/ formatting (CI-safe, non-mutating)
    cmd: tofu fmt -check -recursive -diff tofu/

  tofu:validate:
    desc: tofu validate per tofu dir (modules + examples; init -backend=false, no state)
    cmd: |
      set -e
      # tests/fixtures/** are test INPUTS exercised via `tofu test` (run { module })
      # — partial stand-in modules (e.g. a colliding-catalog with no main.tf), not
      # standalone modules, so they are excluded from the validate/lint sweep.
      for m in $(find tofu -type f -name '*.tf' -not -path '*/tests/fixtures/*' -exec dirname {} \; | sort -u); do
        echo "=== validate ${m} ==="
        ( cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu validate )
      done

  tofu:lint:
    desc: tflint per tofu dir (modules + examples)
    cmd: |
      set -e
      # Excludes tests/fixtures/** — see tofu:validate rationale (test-input
      # stand-in modules, not standalone modules; a fixture symlinking the real
      # composition.tf without main.tf trips terraform_unused_declarations).
      for m in $(find tofu -type f -name '*.tf' -not -path '*/tests/fixtures/*' -exec dirname {} \; | sort -u); do
        echo "=== tflint ${m} ==="
        ( cd "$m" && tflint --chdir=. )
      done

  tofu:docs:
    # Fail-closed, and NOT the way to refresh the current tables. No module
    # README carries BEGIN_TF_DOCS markers today — their Inputs/Outputs tables
    # are hand-maintained. `--output-mode inject` does not no-op on a
    # marker-less file: it APPENDS a full generated block (markers +
    # Requirements/Providers/Inputs/Outputs, ~114 lines) and exits 0, leaving
    # the README with two competing, divergent table sets. The former `|| true`
    # hid nothing, because nothing failed — it just made the damage silent.
    # Verified by running it (terraform-docs v0.22.0) on 2026-07-15; ADR-0015's
    # dated correction records the finding.
    #
    # So: refuse rather than corrupt. Adopting generated tables is a real
    # change — commit the markers, accept the generated shape, reconcile the
    # hand-written prose around them — not something a doc-refresh command
    # should do as a side effect.
    desc: "Regenerate module READMEs' terraform-docs block. Requires BEGIN_TF_DOCS markers; refuses on a marker-less README, whose tables are hand-maintained (see knowledge/reference/tasks.md)."
    cmd: |
      set -e
      for m in {{.TOFU_MODULES}}; do
        if ! grep -q 'BEGIN_TF_DOCS' "$m/README.md" 2>/dev/null; then
          echo "ERROR: $m/README.md carries no BEGIN_TF_DOCS markers." >&2
          echo "  Its Inputs/Outputs tables are hand-maintained — edit them by hand." >&2
          echo "  Running terraform-docs --output-mode inject here would APPEND a second," >&2
          echo "  competing generated table set rather than update anything." >&2
          exit 1
        fi
        terraform-docs markdown table --output-file README.md --output-mode inject "$m"
      done

  tofu:check:readme-parity:
    # The gate the deleted knowledge/reference/talos-cluster-module.md was
    # removed in favour of. That deletion argued an ungated copy rots; this
    # keeps the surviving copy from being one. No spec owns a README, so
    # spec:check-staleness cannot cover it.
    desc: "CI fence: every module variable/output appears in its (hand-maintained) README table"
    cmd: scripts/check-module-readme-parity.sh

  tofu:lint:yaml:
    desc: yamllint + markdownlint over tofu/ (module READMEs, example manifests)
    cmd: |
      yamllint -d relaxed tofu/ 2>/dev/null || true
      markdownlint 'tofu/**/*.md' || true

  tofu:check:render-determinism:
    # The #123 render-determinism fence — full rationale in scripts/check-render-determinism.sh.
    desc: "CI fence: Cilium/ArgoCD/CRD helm renders must use frozen terraform_data (ignore_changes), not live data.helm_template"
    cmd: scripts/check-render-determinism.sh

  tofu:check:argocd-day0-apply-shape:
    # #218 — full rationale in scripts/check-argocd-day0-apply-shape.sh. The
    # provisioner's command string is not observable from a `tofu test`, and the
    # tftest that binds the PAYLOAD needs the network, so it runs only in the
    # advisory `tofu:test`. This offline fence is the blocking layer.
    desc: "CI fence: the Day-0 ArgoCD apply stays server-side, CRD-only-guarded, and never forces conflicts"
    cmd: scripts/check-argocd-day0-apply-shape.sh

  tofu:check:argocd-gate-bites:
    # #218 — both fences above are static text analysis, and the module has one
    # shape at a time (the compliant one), so a fence that matched nothing would
    # report OK forever. This mutates a COPY of main.tf per regression and
    # asserts each fence's error message, not just its exit code. Rationale and
    # the two real near-misses that motivated it: the script header.
    desc: "CI fence: prove the Day-0 ArgoCD fences actually bite (mutation bite-check over a main.tf copy)"
    cmd: scripts/check-argocd-gate-bites.sh

  tofu:check:kubeconfig-endpoint-regen:
    # PR #187 review blocker #3 — full rationale in scripts/check-kubeconfig-endpoint-regen.sh.
    # Without this, deleting the entire lifecycle block from main.tf leaves the
    # full offline tofu test suite + tofu validate green (issue #186 regresses
    # silently); this is the only committed check that references
    # replace_triggered_by / kubeconfig_endpoint_marker.
    desc: "CI fence: talos_cluster_kubeconfig.this keeps replace_triggered_by wired to terraform_data.kubeconfig_endpoint_marker (input = var.cluster_endpoint)"
    cmd: scripts/check-kubeconfig-endpoint-regen.sh

  tofu:check:node-projection-wiring:
    # Issue #204 — full rationale in scripts/check-node-projection-wiring.sh.
    # The offline fixture omits main.tf, so no `tofu test` can see WHICH node
    # projection reaches WHICH Talos argument; swapping two of them leaves the
    # whole suite green while pointing talosctl and the apply-blocking health
    # gate at the wrong node set.
    desc: "CI fence: the Talos boundary arguments stay bound to their intended node projections (nodes.tf), and the per-node apply keeps iterating local.nodes_checked"
    cmd: scripts/check-node-projection-wiring.sh

  tofu:check:cilium-operator-replicas-key:
    # Full rationale in scripts/check-cilium-operator-replicas-key.sh. Helm
    # merges values without --strict, so a renamed or mis-nested
    # `operator.replicas` is discarded silently and the rendered Deployment keeps
    # a different count with every offline test green. The runs that read the
    # RENDERED Deployment live in the network-dependent composition suite, whose
    # CI job is advisory, so this offline fence is the blocking layer — same
    # shape as tofu:check:argocd-day0-apply-shape.
    desc: "CI fence: the Cilium operator replica count keeps its chart key spelling on both sides (computed contributor + floor), and `operator` stays a single merge term"
    cmd: scripts/check-cilium-operator-replicas-key.sh

  tofu:check:shim-key-parity:
    # Full rationale in scripts/check-shim-key-parity.sh. The worked example's
    # shim reads cluster.yaml through try(), which is total: a mistyped key
    # yields the default instead of an error, so the declared value never
    # reaches the module while lint, validate, plan and the whole test suite
    # stay green. This is the only check that binds the two sides.
    desc: "CI fence: every key of a CLOSED substrate object in schemas/cluster.schema.json is actually read by the worked example's cluster.yaml shim"
    cmd: scripts/check-shim-key-parity.sh

  tofu:test:
    desc: "tofu test — node-capability composition regression suite (dedup/determinism + hard-error guards). NETWORK: resolves the live Image Factory, so it is NOT part of tofu:ci (which stays offline). Superset of tofu:test:offline."
    cmd: |
      cd tofu/modules/talos-cluster && tofu init -input=false >/dev/null && tofu test

  tofu:test:offline:
    # The offline SUBSET of tofu:test, so tofu:ci can carry it. These suites
    # point at ./tests/fixtures/* stand-in modules that symlink the real code
    # under test and declare no providers, so they are a pure plan over
    # terraform_data — no network, no Image Factory. tofu:test still runs them
    # (it runs everything); this target exists so the catalog's authoring
    # contract, the conflict guards, input validation, and the consumer
    # image-kernel-arg oracles (AC2/AC6, issue #169 — their oracle is
    # local.node_hash, a pure plan-time function, so they need no network
    # either) are checked by the offline chain rather than only by the
    # network-dependent one.
    desc: "tofu test — the offline suites only (predicate-only catalog contract + conflict guards + input validation + image kernel-args). No network; part of tofu:ci."
    cmd: |
      cd tofu/modules/talos-cluster && tofu init -input=false >/dev/null && tofu test \
        -filter=tests/profile-predicate-only.tftest.hcl \
        -filter=tests/conflict-guards.tftest.hcl \
        -filter=tests/input-validation.tftest.hcl \
        -filter=tests/image-kernel-args.tftest.hcl \
        -filter=tests/kubeconfig-endpoint-marker.tftest.hcl

  tofu:ci:
    desc: "Full local tofu validation: fmt:check + validate + lint + check:render-determinism + check:argocd-day0-apply-shape + check:argocd-gate-bites + check:readme-parity + check:kubeconfig-endpoint-regen + check:node-projection-wiring + check:shim-key-parity + check:cilium-operator-replicas-key + test:offline — mirrors CI, stays offline"
    cmds:
      - task: tofu:fmt:check
      - task: tofu:validate
      - task: tofu:lint
      - task: tofu:check:render-determinism
      - task: tofu:check:argocd-day0-apply-shape
      - task: tofu:check:argocd-gate-bites
      - task: tofu:check:readme-parity
      - task: tofu:check:kubeconfig-endpoint-regen
      - task: tofu:check:node-projection-wiring
      - task: tofu:check:shim-key-parity
      - task: tofu:check:cilium-operator-replicas-key
      - task: tofu:test:offline

  # ===========================================================================
  # gitops:* — kustomize manifest validation + rendered-manifests pipeline
  # ===========================================================================
  gitops:validate:
    desc: kustomize-render + SOPS check + conftest + kubeconform + ArgoCD substrate invariants across all rendered manifests
    cmd: |
      set -e
      ./scripts/discover_kustomize_targets.sh
      ./scripts/render_kustomize_safe.sh
      ./scripts/verify_sops_files.sh
      ./scripts/run_conftest.sh
      for f in $(cat .work/kustomize-rendered-files.txt 2>/dev/null); do
        echo "kubeconform: $f"
        kubeconform -strict -ignore-missing-schemas "$f"
      done
      # conftest bite-check: the committed invalid-Application fixture must be
      # DENIED with each expected message — relaxing a source-classification/
      # pinning rule in policies/conftest/argocd.rego turns this red.
      if conftest test --all-namespaces --policy policies/conftest scripts/fixtures/argocd-invalid-applications.yaml >/dev/null 2>&1; then
        echo "ERROR: conftest bite-check — the invalid-Application fixture was not denied"; exit 1
      fi
      bite_out=$(conftest test --all-namespaces --policy policies/conftest scripts/fixtures/argocd-invalid-applications.yaml 2>&1 || true)
      for m in "must set chart (helm), path (git), ref (values anchor) or plugin" "helm block but neither chart nor path" "is floating"; do
        if ! printf '%s\n' "$bite_out" | grep -qF "$m"; then
          echo "ERROR: conftest bite-check — expected deny \"$m\" did not fire:"; printf '%s\n' "$bite_out"; exit 1
        fi
      done
      echo "conftest bite-check OK: all three source-classification/pinning denies fire"
      ./scripts/check-argocd-substrate-invariants.sh
      # The bootstrap render is part of what this repo delivers to a consumer,
      # so its gate belongs in the target AGENTS.md §Testing Guidelines names as
      # the pre-PR requirement. Wired in CI only, a contributor following the
      # documented checklist would never run it.
      ./scripts/check-bootstrap-render.sh
      # kubernetes/bootstrap/cilium/values.yaml ships in the OCI artifact and is
      # what a consumer copies into a Day-2 self-managed Application, but no gate
      # ever rendered it — so a value the pinned chart REMOVED was dropped silently
      # (issue #211). Validates its key paths against the pinned chart's own
      # values.schema.json. Networked: SKIPS loudly if the registry is unreachable,
      # FAILS on a value the chart does not declare.
      ./scripts/check-cilium-reference-values.py

  gitops:render-component:
    desc: 'Stage-1+2 render of one component. Usage: task gitops:render-component COMPONENT=<name>'
    cmd: |
      component='{{.COMPONENT | default ""}}'
      if [ -z "$component" ]; then echo "usage: task gitops:render-component COMPONENT=<name>"; exit 1; fi
      ./scripts/render-component.sh "$component"

  gitops:render-all:
    desc: Render every component that has a chart.lock.yaml
    cmd: |
      components="$(find kubernetes/substrate -mindepth 2 -maxdepth 2 -name chart.lock.yaml -exec dirname {} \; | xargs -n1 basename | sort)"
      if [ -z "$components" ]; then echo "no chart.lock.yaml files yet — nothing to render"; exit 0; fi
      for c in $components; do ./scripts/render-component.sh "$c"; done

  gitops:verify-rendered:
    desc: Re-render all components and fail if committed _rendered/ drifts
    cmd: ./scripts/verify-rendered.sh

  # ===========================================================================
  # bootstrap:* — consumer App-of-Apps root seed
  # ===========================================================================
  # ArgoCD itself (controller + namespace + sops-age-key Secret + CRDs) is
  # delivered by tofu/modules/talos-cluster as a Talos inlineManifest SEED
  # (deploy_argocd=true) + kubectl server-side CRDs — NOT by these tasks. The
  # bootstrap:argocd task only seeds the consumer-identity App-of-Apps root
  # (root-project + root-application), which the module does NOT deliver.
  bootstrap:render-root:
    # Public (was internal) so the render is invocable without the kubectl
    # apply path that follows it in bootstrap:argocd — that is what lets
    # scripts/check-bootstrap-render.sh bind the render's spec scenarios
    # offline in CI. It is also a useful dry-run: render and inspect the two
    # root manifests without touching a cluster.
    desc: "Render the App-of-Apps root manifests from cluster.yaml into kubernetes/bootstrap/argocd/_out/ (no cluster contact). Usage: task bootstrap:render-root [ENV=cluster.yaml]"
    env:
      # Bound through env:, NOT interpolated into the command string. go-task
      # renders {{.ENV}} as RAW TEXT before sh parses it, so a bare `{{.ENV}}`
      # made `ENV='cluster.yaml; cmd'` execute cmd — and merely QUOTING it
      # ("{{.ENV}}") does not close that: command substitution expands inside
      # double quotes, so `ENV='$(cmd)'` still executed (verified — the probe
      # file appeared). Binding it here means the shell only ever sees the
      # variable reference "$RENDER_ENV", which it does not re-parse.
      # Same fix, same reason, as SPEC_BASE in spec:check-staleness.
      RENDER_ENV: '{{.ENV}}'
    cmd: |
      # Explicit, not inherited: every guard below is fail-closed only while a
      # failing statement aborts the block. Without this, that property rests
      # on the go-task runner's shell defaulting to errexit — a runner bump
      # would silently turn "reject the value" into "render an empty field".
      # The repo sets it explicitly in gitops:validate / tofu:validate /
      # knowledge:validate / spec:validate for the same reason.
      set -e
      # `select(type == "!!str")` with -e: a non-scalar key (map/sequence)
      # would otherwise serialize its whole subtree into the value and inject
      # YAML structure below. -e turns the empty select result into exit 1.
      CLUSTER_NAME=$(yq -e '.cluster.name | select(type == "!!str")' "$RENDER_ENV")
      REPO_URL=$(yq -e '.repo.url | select(type == "!!str")' "$RENDER_ENV")
      OVERLAY=$(yq -e '.cluster.overlay | select(type == "!!str")' "$RENDER_ENV")
      TARGET_REVISION=$(yq -e '(.cluster.target_revision // "main") | select(type == "!!str")' "$RENDER_ENV")
      # Containment of the value inside its YAML scalar position. envsubst
      # substitutes text, not YAML, so a value carrying a newline breaks out
      # of its field and injects sibling keys/list items — e.g. a repo.url of
      # "https://ok\n    - '*'" widens the AppProject's sourceRepos to every
      # repo. The schema cannot catch it: repo.url/overlay/target_revision are
      # plain strings, and nothing runs the schema before this render anyway.
      # An empty value is rejected for the same class of reason: `overlay: ""`
      # is schema-valid and renders `path: kubernetes/overlays/`, pointing the
      # root Application at the whole overlay tree with prune+selfHeal on.
      # Control-character test by BYTE-LENGTH DIFFERENCE (strip [:cntrl:] and
      # compare `wc -c`), because the three obvious forms are each wrong and
      # each was tried here:
      #   * `case "$v" in *"$nl"*)` where nl=$(printf '\n') — `nl` is EMPTY
      #     (command substitution strips trailing newlines) so `*""*` matches
      #     EVERY value: a guard that rejects the happy path too.
      #   * `wc -l` — counts \n only. A lone CARRIAGE RETURN passed it and
      #     rendered `path: kubernetes/overlays/prod<CR>    injected: yes`,
      #     which YAML-parses as a broken document (verified: yq reports
      #     "mapping values are not allowed in this context"). YAML 1.2 treats
      #     \r as a line break too, so \n alone is the wrong test.
      #   * `grep -q '[[:cntrl:]]'` — grep is LINE-oriented: a \n in the value
      #     is the line separator and never appears as line CONTENT, so this
      #     catches \r but silently misses \n. It is the inverse blind spot of
      #     `wc -l`, and the fixtures caught it.
      # `tr -d` operates on bytes, so it sees both. Tabs and the other C0 codes
      # are swept in with them: none belongs in a cluster name, repo URL,
      # overlay name or git ref.
      for v in "$CLUSTER_NAME" "$REPO_URL" "$OVERLAY" "$TARGET_REVISION"; do
        case "$v" in
          "") echo "ERROR: cluster.yaml value is empty; the rendered manifest would carry an empty field"; exit 1;;
          *\$*) echo "ERROR: cluster.yaml value contains '\$' which is unsafe for envsubst: $v"; exit 1;;
        esac
        if [ "$(printf '%s' "$v" | wc -c)" -ne "$(printf '%s' "$v" | LC_ALL=C tr -d '[:cntrl:]' | wc -c)" ]; then
          echo "ERROR: cluster.yaml value contains a control character (line break or tab), which would break it out of its YAML scalar position in the rendered manifest: $v"; exit 1
        fi
        # Generic backstop: the value must survive a YAML round-trip AS ITSELF.
        # The checks above are character-class filters, and a character class
        # cannot express "means something else to a YAML parser". These are all
        # plain !!str, non-empty, $-free and control-char-free, and each one
        # changes meaning when substituted into a scalar position:
        #   repo.url: "'*'"  -> renders `- '*'` -> sourceRepos: ["*"]
        #                       — the AppProject trusts EVERY repo. No line
        #                       break needed; this is the RBAC widening the
        #                       newline guard was written for, by another road.
        #   overlay: " "     -> renders `path: kubernetes/overlays/ `; YAML
        #                       strips trailing space, so the parsed value is
        #                       `kubernetes/overlays/` — the whole-overlay-tree
        #                       defect the empty guard exists to stop.
        #   overlay: "p #x"  -> the ` #` starts a comment; parses to `p`.
        #   overlay: "&a"    -> an anchor; parses to empty.
        # Round-tripping the value through the same parser that will read the
        # manifest catches the class rather than enumerating its members.
        if [ "$(printf '%s' "x: $v" | yq -r '.x' 2>/dev/null)" != "$v" ]; then
          echo "ERROR: cluster.yaml value does not survive a YAML round-trip as itself — it carries YAML syntax (quoting, a comment, an anchor, an indicator) and would mean something else in the rendered manifest: $v"; exit 1
        fi
      done
      # POSITIVE bound on the overlay, because the guards above are all
      # NEGATIVE (reject what looks dangerous) and the sink is a path:
      # root-application.yaml.tmpl renders `path: kubernetes/overlays/${OVERLAY}`
      # on an Application carrying prune: true + selfHeal: true. `overlay: ".."`
      # is a plain, non-empty, $-free, control-char-free !!str that round-trips
      # as itself — it passes every check above — and renders
      # `path: kubernetes/overlays/..`, i.e. `kubernetes/`, handing ArgoCD
      # ownership of the whole tree including kubernetes/bootstrap/. Escaping
      # syntax was never the whole risk; the value can mean something dangerous
      # while being perfectly well-formed.
      # The overlay is a single kustomize directory NAME (schema description),
      # so it takes cluster.name's alphabet. The schema now carries the same
      # pattern, but the schema does not run on this path — bootstrap:argocd
      # deps on this task alone — so the render bounds it itself.
      case "$OVERLAY" in
        *[!a-z0-9-]*|-*|*-|"")
          echo "ERROR: cluster.overlay must be a single lowercase kustomize directory name matching ^[a-z0-9]([-a-z0-9]*[a-z0-9])?\$ — it is interpolated into the root Application's spec.source.path, so anything else (a path segment like '..', an absolute path, whitespace) points a prune+selfHeal Application somewhere it should not go. Got: $OVERLAY"; exit 1;;
      esac
      # Label-safe form of the revision for app.kubernetes.io/version: a git
      # ref may carry '/' etc., but a label VALUE is limited to 63 chars of
      # [A-Za-z0-9_.-] with alphanumeric ends. spec.source.targetRevision
      # keeps the raw value.
      TARGET_REVISION_LABEL=$(printf '%s' "$TARGET_REVISION" | LC_ALL=C tr -c 'A-Za-z0-9_.-' '_' | cut -c1-63 | sed -e 's/^[^A-Za-z0-9]*//' -e 's/[^A-Za-z0-9]*$//')
      if [ -z "$TARGET_REVISION_LABEL" ]; then
        echo "ERROR: cluster.target_revision '$TARGET_REVISION' yields an empty label-safe value for app.kubernetes.io/version"; exit 1
      fi
      export CLUSTER_NAME REPO_URL OVERLAY TARGET_REVISION TARGET_REVISION_LABEL
      # Render into a temp dir and move only once BOTH renders succeeded: a
      # `>` redirect truncates its target before the command runs, so
      # rendering straight into _out/ would leave the first manifest behind
      # when the second render fails — a half-populated _out/ that the next
      # `kubectl apply -f` would happily consume.
      #
      # The envsubst SHELL-FORMAT argument is an allowlist over the TEMPLATE
      # text: only these names expand, so a $NAME a template picks up
      # elsewhere stays literal instead of resolving against the render host's
      # environment. It does NOT protect the substituted VALUES — envsubst is
      # single-pass and never rescans what it inserted; that is why the
      # guards above operate on the values themselves.
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      envsubst '$CLUSTER_NAME $REPO_URL $OVERLAY $TARGET_REVISION $TARGET_REVISION_LABEL' \
        < kubernetes/bootstrap/argocd/root-application.yaml.tmpl \
        > "$tmp/root-application.yaml"
      envsubst '$CLUSTER_NAME $REPO_URL $TARGET_REVISION_LABEL' \
        < kubernetes/bootstrap/argocd/root-project.yaml.tmpl \
        > "$tmp/root-project.yaml"
      mkdir -p kubernetes/bootstrap/argocd/_out
      mv "$tmp/root-application.yaml" "$tmp/root-project.yaml" kubernetes/bootstrap/argocd/_out/

  bootstrap:argocd:
    desc: "Seed the consumer App-of-Apps root (root-project + root-application). Preconditions: deploy_argocd=true AND a completed `tofu apply` (it seeds ArgoCD + applies its CRDs server-side). Usage: task bootstrap:argocd [ENV=cluster.yaml]"
    deps: [bootstrap:render-root]
    # The waits restore the cross-context ordering barrier the removed
    # `argocd-install` helm-path kubectl-wait gave: BOTH ArgoCD CRDs (Application +
    # AppProject — the two root kinds) established + the server ready before the
    # root manifests are applied. `kubectl wait` errors NotFound on an absent
    # object, so existence is polled first; a persistent NotFound means
    # `tofu apply` did not finish its CRD step — recover with
    # `tofu apply -replace=null_resource.argocd_crds[0]`.
    cmds:
      - |
        for crd in applications.argoproj.io appprojects.argoproj.io; do
          echo "waiting for CRD $crd to exist + establish ..."
          for i in $(seq 1 60); do kubectl get crd "$crd" >/dev/null 2>&1 && break; sleep 2; done
          kubectl wait --for=condition=established "crd/$crd" --timeout=120s
        done
      - kubectl wait --for=condition=available -n argocd deployment/argocd-server --timeout=300s
      - kubectl apply -f kubernetes/bootstrap/argocd/_out/root-project.yaml
      - kubectl apply -f kubernetes/bootstrap/argocd/_out/root-application.yaml

  bootstrap:check-render:
    desc: "CI gate: assert bootstrap:render-root satisfies the argocd-day-zero-bootstrap spec scenarios (offline — yq + envsubst only, no cluster)"
    cmd: scripts/check-bootstrap-render.sh

  bootstrap:argocd-password:
    desc: Print the initial ArgoCD admin password (rotate after first login)
    cmd: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo

  # ===========================================================================
  # cluster:* — declarative cluster SoT (cluster.yaml)
  # ===========================================================================
  cluster:init-yaml:
    desc: Copy cluster.yaml.example to cluster.yaml (gitignored declarative SoT) if absent
    cmd: |
      if [ ! -e cluster.yaml ]; then
        cp cluster.yaml.example cluster.yaml
        echo "Created cluster.yaml from cluster.yaml.example -- fill in your cluster values"
      fi

  # ===========================================================================
  # supply-chain:* — OCI artifact verification
  # ===========================================================================
  supply-chain:oci-allowlist:
    desc: Build the talos OCI tarball locally and diff against .ci-oci-tarball-expected.txt (fail-closed)
    # Allowlist-based (fail-closed) tarball verification. Builds locally per the
    # same logic as oci-publish.yml "Build tarball" + "Verify tarball contents".
    # Run before pushing a tag to confirm the fixture matches actual contents.
    cmd: |
      set -e
      [ -f .ci-oci-tarball-include.txt ] || { echo "ERROR: .ci-oci-tarball-include.txt not found"; exit 1; }
      [ -f .ci-oci-tarball-expected.txt ] || { echo "ERROR: .ci-oci-tarball-expected.txt not found"; exit 1; }
      mkdir -p .work
      tar -czf .work/oci-check.tar.gz --files-from=.ci-oci-tarball-include.txt
      tar -tzf .work/oci-check.tar.gz | sed 's|^\./||' | LC_ALL=C sort | sed 's|^|./|' > .work/oci-check-contents.txt
      if diff -u .ci-oci-tarball-expected.txt .work/oci-check-contents.txt; then
        echo "OK: tarball contents match .ci-oci-tarball-expected.txt"
      else
        echo "FAIL: tarball contents diverge from .ci-oci-tarball-expected.txt"
        echo "To update the fixture: mv .work/oci-check-contents.txt .ci-oci-tarball-expected.txt"
        exit 1
      fi
      rm -f .work/oci-check.tar.gz
      ./scripts/check-substrate-consumability.sh

  # ===========================================================================
  # knowledge:* — OKF knowledge bundle (knowledge/) authoring + validation
  # ===========================================================================
  knowledge:validate:
    desc: Validate the knowledge/ OKF bundle (openknowledge + offline link check)
    cmd: |
      set -e
      command -v openknowledge >/dev/null 2>&1 || { echo "ERROR: 'openknowledge' not installed — run 'task knowledge:install-cli'"; exit 1; }
      command -v lychee >/dev/null 2>&1 || { echo "ERROR: 'lychee' not installed — run 'task knowledge:install-cli'"; exit 1; }
      openknowledge validate knowledge/
      # Offline link-resolution gate: intra-repo markdown links must resolve.
      # Scope: the bundle, root orientation files, contracts/. CHANGELOG.md is
      # a historical record and excluded by design. The two tofu READMEs ship
      # in the OCI tarball and carry relative links into knowledge/ — checked
      # so a decision rename cannot rot them silently.
      lychee --offline --no-progress --exclude-path CHANGELOG.md \
        'knowledge/**/*.md' './*.md' 'contracts/*.md' \
        'tofu/modules/talos-cluster/README.md' \
        'tofu/modules/talos-cluster/test/README.md'

  knowledge:rules-apply:
    desc: Regenerate the Open Knowledge maintenance block in AGENTS.md (managed block)
    cmd: |
      set -e
      {{.OK_GUARD}}
      # --yes: without it the CLI prompts and, when declined, still exits 0 —
      # the target would report success while having written nothing.
      openknowledge prompt rules apply {{.OK_RULES}} \
        --path knowledge --file AGENTS.md --target generic --yes
      grep -q '<!-- openknowledge:rules:start -->' AGENTS.md || {
        echo "FAIL: no managed block in AGENTS.md after apply"; exit 1; }
      echo "AGENTS.md managed block regenerated — review the diff before committing."

  knowledge:rules-check:
    desc: Fail if AGENTS.md's managed block drifted from the rules catalog
    cmd: |
      set -e
      {{.OK_GUARD}}
      # --dry-run prints a "Would update ..." preamble before the block, so the
      # block MUST be extracted by marker on both sides. Same extractor for
      # both, or the two sides can disagree on trailing lines alone.
      extract_block() { awk '/<!-- openknowledge:rules:start -->/,/<!-- openknowledge:rules:end -->/'; }

      # Keep stderr: when the render fails (unknown rule, unreadable rule
      # document, bad config) it is the only statement of the actual cause.
      #
      # The render runs inside a pipeline, so its status is awk's and `set -e`
      # never sees a failure — the CLI exits 2 on a renamed subcommand
      # (measured against 0.12.0: the pre-0.12 `rules apply` form prints
      # "unknown command: rules" and exits 2) and this target would still
      # pass. The emptiness assertion below is the only thing that catches
      # it; do not "simplify" it away.
      err="$(mktemp)"
      gen="$(openknowledge prompt rules apply {{.OK_RULES}} \
        --path knowledge --file AGENTS.md --target generic --dry-run 2>"$err" | extract_block)"
      cur="$(extract_block < AGENTS.md)"

      # A vacuous pass (empty vs empty) would be a green gate checking nothing.
      [ -n "$gen" ] || {
        echo "FAIL: openknowledge produced no managed block. Its output was:"
        cat "$err"; rm -f "$err"; exit 1; }
      rm -f "$err"
      [ -n "$cur" ] || { echo "FAIL: AGENTS.md has no managed block — run 'task knowledge:rules-apply'"; exit 1; }

      starts="$(grep -c '<!-- openknowledge:rules:start -->' AGENTS.md || true)"
      ends="$(grep -c '<!-- openknowledge:rules:end -->' AGENTS.md || true)"
      [ "$starts" = "1" ] && [ "$ends" = "1" ] || { echo "FAIL: AGENTS.md must contain exactly one marker pair (found $starts/$ends)"; exit 1; }

      # Assert every configured rule reached the block. Anchored on the
      # "Enabled rules:" list entry ("- <id>: <summary>") rather than a bare
      # substring: an unanchored search for "decisions" also matches prose
      # mentioning knowledge/decisions/, so a rule that failed to render would
      # still pass. One body heading per rule is checked too — the enabled
      # list echoes back what was requested, the headings prove it rendered.
      # "Enabled rules:" heads the requested-rule list and is not a body.
      headings="$(printf '%s\n' "$gen" | grep ' rules:$' | grep -vc '^Enabled rules:$' || true)"
      want=0
      for rule in $(echo "{{.OK_RULES}}" | tr ',' ' '); do
        want=$((want + 1))
        printf '%s\n' "$gen" | grep -qE "^- ${rule}: " || {
          echo "FAIL: rule '$rule' is not in the block's enabled list — is knowledge/rules/ intact?"; exit 1; }
      done
      [ "$headings" = "$want" ] || {
        echo "FAIL: block has $headings rule bodies, expected $want — a rule rendered no instruction bullets"; exit 1; }

      if ! diff -u <(printf '%s\n' "$cur") <(printf '%s\n' "$gen"); then
        echo "FAIL: AGENTS.md managed block drifted — run 'task knowledge:rules-apply'"; exit 1
      fi
      echo "OK: AGENTS.md managed block is in sync."

  knowledge:new:
    desc: "Scaffold a new knowledge concept (usage: task knowledge:new FILE=reference/foo.md TYPE=reference)"
    requires:
      vars: [FILE, TYPE]
    cmd: |
      set -e
      target="knowledge/{{.FILE}}"
      [ -e "$target" ] && { echo "ERROR: $target already exists"; exit 1; }
      mkdir -p "$(dirname "$target")"
      printf -- '---\ntype: {{.TYPE}}\ntitle: TODO\ndescription: TODO one sentence.\ntags: [TODO]\ntimestamp: %s\nsources:\n  - TODO\n---\n\n# TODO\n' "$(date +%Y-%m-%d)" > "$target"
      echo "Created $target — fill frontmatter, then run 'task knowledge:validate'."

  knowledge:install-cli:
    desc: Install pinned openknowledge + lychee binaries into ~/.local/bin (checksum-verified)
    cmd: |
      set -e
      os="{{OS}}"; arch="{{ARCH}}"
      case "$os-$arch" in
        darwin-arm64) ok_sha="{{.OPENKNOWLEDGE_SHA256_DARWIN_ARM64}}"; ly_sha="{{.LYCHEE_SHA256_DARWIN_ARM64}}"; ok_asset="openknowledge_darwin_arm64.tar.gz"; ly_asset="lychee-aarch64-apple-darwin.tar.gz" ;;
        darwin-amd64) ok_sha="{{.OPENKNOWLEDGE_SHA256_DARWIN_AMD64}}"; ly_sha="{{.LYCHEE_SHA256_DARWIN_AMD64}}"; ok_asset="openknowledge_darwin_amd64.tar.gz"; ly_asset="lychee-x86_64-apple-darwin.tar.gz" ;;
        linux-amd64)  ok_sha="{{.OPENKNOWLEDGE_SHA256_LINUX_AMD64}}";  ly_sha="{{.LYCHEE_SHA256_LINUX_AMD64}}";  ok_asset="openknowledge_linux_amd64.tar.gz"; ly_asset="lychee-x86_64-unknown-linux-gnu.tar.gz" ;;
        *) echo "ERROR: unsupported platform $os-$arch — install openknowledge {{.OPENKNOWLEDGE_VERSION}} + lychee {{.LYCHEE_VERSION}} manually"; exit 1 ;;
      esac
      # sha256sum on Linux, shasum on macOS — match whichever is present so
      # the local path verifies with the same tool class as CI.
      if command -v sha256sum >/dev/null 2>&1; then shatool="sha256sum"; else shatool="shasum -a 256"; fi
      tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
      curl -fsSLo "$tmp/ok.tar.gz" "https://github.com/openknowledge-sh/openknowledge/releases/download/v{{.OPENKNOWLEDGE_VERSION}}/$ok_asset"
      echo "$ok_sha  $tmp/ok.tar.gz" | $shatool -c - >/dev/null
      tar -xzf "$tmp/ok.tar.gz" -C "$tmp"
      curl -fsSLo "$tmp/ly.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v{{.LYCHEE_VERSION}}/$ly_asset"
      echo "$ly_sha  $tmp/ly.tar.gz" | $shatool -c - >/dev/null
      tar -xzf "$tmp/ly.tar.gz" -C "$tmp"
      # lychee release tarballs nest the binary per-target (e.g.
      # lychee-aarch64-apple-darwin/lychee); openknowledge ships it flat.
      ly_bin="$(find "$tmp" -type f -name lychee | head -1)"
      [ -n "$ly_bin" ] || { echo "ERROR: lychee binary not found in release tarball"; exit 1; }
      mkdir -p "$HOME/.local/bin"
      install -m 0755 "$tmp/openknowledge" "$HOME/.local/bin/openknowledge"
      install -m 0755 "$ly_bin" "$HOME/.local/bin/lychee"
      # On a GitHub runner, ~/.local/bin is not guaranteed on PATH for
      # subsequent steps — persist it so later `task *:validate` steps
      # resolve the binaries. No-op outside GitHub Actions.
      [ -n "${GITHUB_PATH:-}" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      echo "Installed openknowledge $("$HOME/.local/bin/openknowledge" version) + lychee {{.LYCHEE_VERSION}} to ~/.local/bin"
      echo "Verify pins: task dev:verify-tools"

  # ===========================================================================
  # docs:* — repo-wide markdown linting (mirrors the docs-lint.yml CI job;
  # the workflow runs exactly these tasks so local == remote).
  # ===========================================================================
  docs:lint:
    desc: markdownlint over the whole repo (same invocation as CI)
    cmd: |
      set -e
      command -v markdownlint >/dev/null 2>&1 || { echo "ERROR: 'markdownlint' not installed — run 'task docs:install-cli'"; exit 1; }
      markdownlint '**/*.md' --ignore-path .markdownlintignore

  docs:install-cli:
    desc: Install the lockfile-pinned markdownlint-cli (npm ci, integrity-verified, lifecycle scripts disabled)
    deps: [dev:npm-ci]
    cmd: |
      set -e
      mkdir -p "$HOME/.local/bin"
      ln -sf "{{.ROOT_DIR}}/node_modules/.bin/markdownlint" "$HOME/.local/bin/markdownlint"
      [ -n "${GITHUB_PATH:-}" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      echo "Installed markdownlint $("$HOME/.local/bin/markdownlint" --version) (lockfile-pinned)"

  # ===========================================================================
  # spec:* — OpenSpec behavioral specs (openspec/). NOT the same tool as
  # knowledge:* (openknowledge validates the OKF bundle; openspec validates
  # behavioral capability specs). See knowledge/workflows/spec-driven-development.md.
  # ===========================================================================
  spec:validate:
    desc: Validate the openspec/ behavioral specs (strict + bite-checks + source partition) + offline link check
    cmd: |
      set -e
      command -v openspec >/dev/null 2>&1 || { echo "ERROR: 'openspec' not installed — run 'task spec:install-cli'"; exit 1; }
      command -v lychee >/dev/null 2>&1 || { echo "ERROR: 'lychee' not installed — run 'task knowledge:install-cli'"; exit 1; }
      openspec validate --all --strict --no-interactive
      # Bite-check: the strict validator must reject a malformed
      # directly-authored spec (guards against a future openspec release
      # going warn-only). Runs against a temp COPY — the working tree is
      # never mutated, so interrupts and concurrent runs are safe.
      bitetmp="$(mktemp -d)"; biteout="$(mktemp)"
      trap 'rm -rf "$bitetmp" "$biteout"' EXIT
      cp -R openspec "$bitetmp/"
      mkdir -p "$bitetmp/openspec/specs/negative-fixture"
      cp scripts/fixtures/openspec-invalid-spec.md "$bitetmp/openspec/specs/negative-fixture/spec.md"
      # Both runs target ONE spec by name, so each exit code is attributable
      # to that spec alone. A whole-tree `validate --all` exit cannot be:
      # it is non-zero for a failure anywhere, and its per-spec output names
      # passing specs too, so neither the code nor a grep for the fixture's
      # name distinguishes "rejected the fixture" from "died for an
      # unrelated reason after listing it".
      # Control run FIRST, on a spec known good: it must pass. Without it a
      # non-zero from the fixture run is not evidence about the fixture —
      # any environmental failure (a CLI erroring outside a git root, a
      # changed usage contract, a Node crash) exits non-zero too and would
      # satisfy the check vacuously and permanently.
      if ! (cd "$bitetmp" && openspec validate node-image-composition --type spec \
              --strict --no-interactive) >"$biteout" 2>&1; then
        echo "ERROR: the bite-check's control run failed — the validator does not"
        echo "accept a known-good spec, so the fixture run below would prove"
        echo "nothing. Its output was:"; cat "$biteout"; exit 1
      fi
      if (cd "$bitetmp" && openspec validate negative-fixture --type spec \
            --strict --no-interactive) >"$biteout" 2>&1; then
        echo "ERROR: strict validate passed a malformed spec — the gate no longer bites"
        cat "$biteout"; exit 1
      fi
      rm -rf "$bitetmp" "$biteout"; trap - EXIT
      # spec_lib parser red-green: the flow-style branches and the
      # declares-primary detector have no committed spec exercising them —
      # this unit test is their only binding.
      python3 scripts/test/test_spec_lib.py >/dev/null || { echo "ERROR: spec_lib parser self-test failed"; python3 scripts/test/test_spec_lib.py; exit 1; }
      # Staleness-gate merge attribution: which commits must carry the
      # 'Spec-Impact: none' trailer is decided by re-running each merge, and
      # neither failure direction (base-sync merge voids the escape / an
      # invented-content merge inherits someone else's trailer) is observable
      # from this repo's own history. Bound against a throwaway fixture repo,
      # controls first, so a regression in either direction turns this red.
      # Require a completion marker, not just exit 0: on a git without
      # 'merge-tree --write-tree' the script runs its controls and reports
      # PARTIAL (CI itself exits 2 there — see the script), and a bare exit code
      # cannot tell that apart from a full pass. Neither marker means the script
      # crashed or was edited into returning 0 without running.
      bite_out="$(./scripts/check-staleness-gate-bite.sh)" || { printf '%s\n' "$bite_out"; exit 1; }
      printf '%s\n' "$bite_out"
      printf '%s\n' "$bite_out" | grep -qE '^staleness-gate bite-check (OK|PARTIAL)' || {
        echo "ERROR: the staleness-gate bite-check produced no completion marker"; exit 1; }
      # Source-ownership partition: exclusivity + completeness over the
      # enumerated substrate source universe (ADR-0015 ownership model).
      python3 scripts/check-spec-partition.py .
      lychee --offline --no-progress 'openspec/**/*.md'

  spec:install-cli:
    desc: Install the lockfile-pinned openspec CLI (npm ci, integrity-verified, lifecycle scripts disabled)
    deps: [dev:npm-ci]
    cmd: |
      set -e
      mkdir -p "$HOME/.local/bin"
      ln -sf "{{.ROOT_DIR}}/node_modules/.bin/openspec" "$HOME/.local/bin/openspec"
      [ -n "${GITHUB_PATH:-}" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      echo "Installed openspec $("$HOME/.local/bin/openspec" --version) (lockfile-pinned)"
      echo "Verify pins: task dev:verify-tools"

  spec:check-regen:
    desc: Regeneration parity — the committed tool trees must equal the pinned generator's output
    cmd: |
      set -e
      command -v openspec >/dev/null 2>&1 || { echo "ERROR: 'openspec' not installed — run 'task spec:install-cli'"; exit 1; }
      # Refuse on dirty generated trees: --force would overwrite uncommitted
      # edits there, and a pre-dirty generated file would mask real drift in
      # the porcelain delta below.
      if [ -n "$(git status --porcelain .claude/ .codex/)" ]; then
        echo "ERROR: uncommitted changes under the generated trees — commit or discard them first."; exit 1
      fi
      # Delta over the WHOLE tree: catches modified, deleted AND newly-added
      # (untracked) files, wherever the generator writes them. Delta-based so
      # it also runs on a locally dirty tree (outside the generated trees);
      # on a pristine CI checkout the delta equals the absolute drift.
      # Scope note: this proves committed == pinned-generator output; it does
      # NOT prove the content is benign — instruction-body review stays
      # mandatory (ADR-0014; the trees are agent-loaded content).
      # The ignored set is snapshotted separately: plain --porcelain omits
      # ignored paths, so generator output landing on a path .gitignore
      # covers (.gitignore ignores .claude/* with narrow negations) would be
      # invisible to the delta below and this target would print OK over
      # real drift. Same delta shape as spec:update's completeness gate —
      # scoped to the generated trees, because a repo-wide ignored snapshot
      # would churn on node_modules/ and every tool cache.
      #
      # Two disclosed residuals, both bounded to the LOCAL run — on the
      # pristine CI checkout that actually gates merges, neither applies:
      #   - --ignored=matching COLLAPSES an ignored directory to one entry
      #     and does not enumerate its contents (git-status documents this).
      #     So a write into a PRE-EXISTING ignored dir under .claude/
      #     (agents/, hooks/, operator scratch) does not move the delta.
      #     In CI those dirs do not exist, so a first creation is caught.
      #   - the ignored set outside .claude//.codex/ (.work/, .mcp.json.local,
      #     ...) is in neither snapshot. Bounded by openspec's write scope,
      #     which is an assumption a CLI upgrade can break — the same class
      #     of upgrade this target exists to detect.
      # Closing either needs a content snapshot (find + hash) rather than a
      # git-status delta; tracked as a follow-up, not silently assumed away.
      before="$(mktemp)"; after="$(mktemp)"
      ignbefore="$(mktemp)"; ignafter="$(mktemp)"
      ignraw="$(mktemp)"
      trap 'rm -f "$before" "$after" "$ignbefore" "$ignafter" "$ignraw"' EXIT
      # The git call is separated from the greps: piping it straight into
      # `grep | sort` would hand the pipeline sort's exit status, so a git
      # failure (a build rejecting --ignored=matching, a pathspec error, a
      # missing .codex/) would land as an empty snapshot on BOTH sides and
      # this target would print OK having checked nothing. Same separation
      # spec:update makes, for the same reason.
      git status --porcelain > "$before"
      git status --ignored=matching --porcelain .claude/ .codex/ > "$ignraw"
      grep '^!!' "$ignraw" | sort > "$ignbefore" || true
      openspec update --force >/dev/null
      git status --porcelain > "$after"
      git status --ignored=matching --porcelain .claude/ .codex/ > "$ignraw"
      grep '^!!' "$ignraw" | sort > "$ignafter" || true
      if ! cmp -s "$before" "$after"; then
        echo "ERROR: regenerating with the pinned openspec changed the tree:"
        diff "$before" "$after" | grep '^>' || true
        exit 1
      fi
      new_ignored="$(comm -13 "$ignbefore" "$ignafter")"
      if [ -n "$new_ignored" ]; then
        echo "ERROR: a gitignored path appeared under the generated trees during"
        echo "the regeneration:"
        echo "$new_ignored"
        echo "If openspec emitted it, the committed trees do NOT equal the"
        echo "generator's output — generated artifacts must be committed"
        echo "(ADR-0014), so extend the generated-subtree negations in"
        echo ".gitignore for THOSE paths only. If an agent harness running"
        echo "alongside wrote it (session state, settings.local.json, todos),"
        echo "it is operator scratch: leave .gitignore alone and re-run."
        exit 1
      fi
      echo "OK: committed tool trees match the pinned generator's output."

  spec:check-staleness:
    desc: "Staleness gate: a diff touching a spec's primary source must also touch the owning spec (escape: 'Spec-Impact: none' commit trailer). Usage: task spec:check-staleness [BASE=origin/main]"
    # BASE reaches the script through the environment, never through the
    # template. go-task renders {{.BASE}} as raw TEXT into the command string
    # before its shell parses it, so the single quotes around a templated
    # value are part of the template, not an escape: a BASE containing a
    # single quote closes them and injects. docs-lint.yml feeds this from
    # github.base_ref — env-binding it there closes the Actions-expression
    # layer only; this closes the shell layer. Verified both directions.
    env:
      SPEC_BASE: '{{.BASE | default "origin/main"}}'
    cmd: python3 scripts/check-spec-staleness.py --base "$SPEC_BASE"

  spec:update:
    desc: Regenerate OpenSpec tool integrations (.claude/, .codex/) after a CLI upgrade
    cmd: |
      set -e
      command -v openspec >/dev/null 2>&1 || { echo "ERROR: 'openspec' not installed — run 'task spec:install-cli'"; exit 1; }
      # Completeness gate, DELTA-based: snapshot the ignored set before the
      # regeneration and fail only on paths the regeneration ADDED to it —
      # pre-existing operator/harness scratch under .claude/ (settings,
      # agents/, hooks/, ...) is expected and must stay ignored. A git
      # failure fails the task (the git call is separated from the greps
      # so a non-zero git exit is never swallowed as "clean").
      # NOTE: --force overwrites any uncommitted edits inside the generated
      # trees — commit or discard tree changes before running.
      before="$(mktemp)"; after="$(mktemp)"
      trap 'rm -f "$before" "$after" "$before.ign" "$after.ign"' EXIT
      git status --ignored=matching --porcelain .claude/ .codex/ > "$before"
      openspec update --force
      git status --ignored=matching --porcelain .claude/ .codex/ > "$after"
      grep '^!!' "$before" | sort > "$before.ign" || true
      grep '^!!' "$after"  | sort > "$after.ign"  || true
      new_ignored="$(comm -13 "$before.ign" "$after.ign")"
      rm -f "$before.ign" "$after.ign"
      if [ -n "$new_ignored" ]; then
        echo "ERROR: the regeneration emitted content that .gitignore ignores:"
        echo "$new_ignored"
        echo "Generated artifacts must be committed (ADR-0014) — extend the"
        echo "generated-subtree negations in .gitignore for THESE paths only."
        exit 1
      fi
      echo "Regenerated. Review the diff as security-relevant content (agent-"
      echo "loaded instructions, see ADR-0014) — then commit."

  # ===========================================================================
  # mcp:* — MCP server binary management (see knowledge/workflows/mcp-setup.md)
  # ===========================================================================
  mcp:install:
    desc: Install MCP server binaries (per-OS) and register wrapper symlink in ~/.local/bin
    cmd: |
      set -e
      command -v gh >/dev/null 2>&1 || { echo "ERROR: 'gh' (GitHub CLI) required — https://cli.github.com"; exit 1; }
      if [ "{{OS}}" = "darwin" ]; then
        command -v brew >/dev/null 2>&1 || { echo "ERROR: 'brew' required on macOS — https://brew.sh"; exit 1; }
        brew install github-mcp-server@{{.MCP_GITHUB_VERSION}} 2>/dev/null || brew install github-mcp-server
        brew install kubernetes-mcp-server@{{.MCP_K8S_VERSION}} 2>/dev/null || brew install kubernetes-mcp-server
        command -v npm >/dev/null 2>&1 || { echo "ERROR: 'npm' required for talos-mcp — https://nodejs.org"; exit 1; }
        npm install -g talos-mcp@{{.MCP_TALOS_VERSION}}
      else
        command -v go >/dev/null 2>&1 || { echo "ERROR: 'go' required on Linux for github-mcp-server — https://go.dev/dl"; exit 1; }
        go install github.com/github/github-mcp-server/cmd/github-mcp-server@v{{.MCP_GITHUB_VERSION}}
        command -v npm >/dev/null 2>&1 || { echo "ERROR: 'npm' required — https://nodejs.org"; exit 1; }
        npm install -g kubernetes-mcp-server@{{.MCP_K8S_VERSION}}
        npm install -g talos-mcp@{{.MCP_TALOS_VERSION}}
      fi
      mkdir -p "$HOME/.local/bin"
      ln -sf "{{.ROOT_DIR}}/scripts/mcp-github-wrapper.sh" "$HOME/.local/bin/mcp-github-wrapper"
      chmod +x "{{.ROOT_DIR}}/scripts/mcp-github-wrapper.sh"
      echo ""
      echo "Installed: $HOME/.local/bin/mcp-github-wrapper -> {{.ROOT_DIR}}/scripts/mcp-github-wrapper.sh"
      echo ""
      echo "Next steps:"
      echo "  1. Ensure \$HOME/.local/bin is in your PATH"
      echo "     Check: echo \$PATH | grep -q \$HOME/.local/bin && echo ok || echo 'ADD to PATH'"
      echo "  2. Run: gh auth login  (if not already authenticated)"
      echo "  3. Run: task mcp:verify"
      echo "  4. Restart Claude Code / Codex CLI"

  mcp:verify:
    desc: Verify MCP binaries, wrapper symlink, and gh auth state
    cmd: |
      fail=0
      for bin in gh github-mcp-server kubernetes-mcp-server talos-mcp mcp-github-wrapper; do
        if command -v "$bin" >/dev/null 2>&1; then
          echo "OK:      $bin -> $(command -v $bin)"
        else
          echo "MISSING: $bin — run 'task mcp:install'"; fail=1
        fi
      done
      if ! gh auth token >/dev/null 2>&1; then
        echo "FAIL:    gh auth token — run 'gh auth login'"; fail=1
      else
        echo "OK:      gh auth token (keychain accessible)"
      fi
      if [ "$fail" -eq 0 ]; then
        echo ""; echo "All checks passed. MCP servers ready."
      else
        echo ""; echo "One or more checks failed — fix above before starting Claude/Codex."; exit 1
      fi

  mcp:uninstall:
    desc: Remove MCP wrapper symlink from ~/.local/bin (leaves binaries in place)
    cmd: |
      if rm -f "$HOME/.local/bin/mcp-github-wrapper"; then
        echo "Removed $HOME/.local/bin/mcp-github-wrapper"
      else
        echo "$HOME/.local/bin/mcp-github-wrapper was not present"
      fi

  # ===========================================================================
  # dev:* — contributor hygiene
  # ===========================================================================
  dev:npm-ci:
    internal: true
    # `run: once` dedupes the install when several install-cli tasks run in
    # ONE task invocation (e.g. `task docs:install-cli spec:install-cli`).
    run: once
    cmd: |
      set -e
      command -v npm >/dev/null 2>&1 || { echo "ERROR: 'npm' required — https://nodejs.org"; exit 1; }
      npm ci --ignore-scripts

  dev:install-pre-commit:
    desc: Install pre-commit hooks and run them once across the repo
    cmd: |
      uvx pre-commit install
      uvx pre-commit run --all-files || true
      echo "pre-commit hooks installed. Run 'uvx pre-commit run --all-files' to validate the full repo."

  dev:verify-tools:
    desc: Confirm installed binaries match .tool-versions pins
    cmd: ./scripts/verify-tools.sh

  dev:verify-pins:
    desc: Assert the Taskfile vars block + package.json agree with .tool-versions (pin SoT)
    cmd: |
      set -eu
      command -v python3 >/dev/null 2>&1 || { echo "ERROR: python3 required for the package.json pin assertions"; exit 2; }
      fail=0
      tv() { awk -v k="$1" '$1==k {print $2}' .tool-versions; }
      # npm-distributed pins live in package.json (locked via
      # package-lock.json); python3 is used because the assert must run
      # BEFORE any install task (yq/jq availability is not guaranteed).
      pj() { python3 -c 'import json,sys; print(json.load(open("package.json"))["devDependencies"][sys.argv[1]])' "$1"; }
      assert() {
        if [ "$2" != "$3" ]; then
          echo "DRIFT: $1 .tool-versions=$2 other=$3"; fail=1
        else
          echo "OK:    $1 $2"
        fi
      }
      assert openknowledge "$(tv openknowledge)" "{{.OPENKNOWLEDGE_VERSION}}"
      assert lychee        "$(tv lychee)"        "{{.LYCHEE_VERSION}}"
      assert openspec      "$(tv openspec)"      "$(pj @fission-ai/openspec)"
      assert markdownlint  "$(tv markdownlint)"  "$(pj markdownlint-cli)"
      # Lockfile provenance: every resolved URL must point at the official
      # npm registry over https — a lockfile edit that redirects a transitive
      # dependency to another host (typo-squat tarball with a self-consistent
      # integrity hash) turns this red. Registry compromise stays out of
      # scope; the integrity hashes pin the fetch to the reviewed lockfile.
      if python3 -c 'import json,sys; d=json.load(open("package-lock.json"))["packages"]; bad=[(k,p["resolved"]) for k,p in d.items() if p.get("resolved") and not p["resolved"].startswith("https://registry.npmjs.org/")]; [print(f"DRIFT: package-lock.json {k} resolves outside registry.npmjs.org: {u}") for k,u in bad]; sys.exit(1 if bad else 0)'; then
        echo "OK:    package-lock.json — all resolved URLs on registry.npmjs.org"
      else
        fail=1
      fi
      exit "$fail"
