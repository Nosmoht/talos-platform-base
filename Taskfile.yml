# Taskfile for talos-platform-base — the single task runner for the substrate base.
# https://taskfile.dev
#
# Scope: this Taskfile is the SOLE runner for the repository. The Makefile was
# retired at v3.0.0 (see knowledge/decisions/0012-makefile-retirement.md); every former target
# folds into a namespaced task here:
#
#   tofu:*         — OpenTofu cluster-lifecycle module (tofu/) validation
#   gitops:*       — kustomize manifest validation + rendered-manifests pipeline
#   bootstrap:*    — consumer App-of-Apps root seed (NOT module-delivered)
#   cluster:*      — declarative cluster SoT (cluster.yaml) init
#   supply-chain:* — OCI tarball allowlist verification
#   mcp:*          — MCP server binary management
#   dev:*          — contributor hygiene (pre-commit, tool pins)
#
# Run `task --list` for the full target list with descriptions.

version: '3'

# Convention (mirrors talos-platform-apps): silent tasks — only the commands
# themselves write to the console, not their own invocation echo.
silent: true

env:
  # openspec bundles a posthog-node telemetry client (anonymous command+version;
  # auto-disabled when CI=true, verified in its dist/telemetry/index.js).
  # Explicit opt-out keeps LOCAL task runs network-quiet too.
  OPENSPEC_TELEMETRY: "0"

vars:
  # Declarative cluster SoT consumed by bootstrap:* (override per invocation:
  # `task bootstrap:argocd ENV=other.yaml`).
  ENV: cluster.yaml
  # Module directories (one per module) — terraform-docs targets these READMEs.
  TOFU_MODULES:
    sh: find tofu/modules -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort
  # MCP server versions — pinned to verified official sources
  # (homebrew/core, containers/k8s, npm/talos-mcp).
  MCP_GITHUB_VERSION: 0.33.0
  MCP_K8S_VERSION: 0.0.60
  MCP_TALOS_VERSION: 1.1.0
  # knowledge:* tool pins — KEEP IN SYNC with .tool-versions and the
  # docs-lint.yml env block. Checksums from the projects' released
  # checksum files (verified 2026-07-11).
  OPENKNOWLEDGE_VERSION: 0.5.0
  OPENKNOWLEDGE_SHA256_DARWIN_ARM64: 8316f6206943e42973f6645b9deebba46299038f223cc1b1fe42d5cb2fac2150
  OPENKNOWLEDGE_SHA256_DARWIN_AMD64: 29801d38436903b043812d04e0a5e364f167c54ab54760cc6cc87a933292f834
  OPENKNOWLEDGE_SHA256_LINUX_AMD64: 0f58de81e52f064fbf52aac5289e0b1b6dc0e58de2f47c4e043263e9e927cb27
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256_DARWIN_ARM64: c9d3740ea2d891854d37116c9fba840f37b6e7c89d330e7db84ac333631c4977
  LYCHEE_SHA256_DARWIN_AMD64: 887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978
  LYCHEE_SHA256_LINUX_AMD64: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
  # spec:*/docs:* tool pins (openspec, markdownlint-cli) live in
  # package.json + package-lock.json — installed via `npm ci
  # --ignore-scripts`. Scope of the control: the lockfile's integrity
  # hashes pin the FETCH to the reviewed lockfile (registry/MITM
  # tampering); they do not vouch for the lockfile's own content —
  # lockfile diffs stay review surface. `task dev:verify-pins` asserts
  # package.json ↔ .tool-versions plus registry-host provenance of every
  # resolved URL; --ignore-scripts disables lifecycle scripts.

tasks:
  default:
    desc: List available targets
    cmd: task --list

  # ===========================================================================
  # tofu:* — OpenTofu cluster-lifecycle module (tofu/)
  # ===========================================================================
  tofu:fmt:
    desc: Rewrite all tofu/ files to canonical format
    cmd: tofu fmt -recursive tofu/

  tofu:fmt:check:
    desc: Verify tofu/ formatting (CI-safe, non-mutating)
    cmd: tofu fmt -check -recursive -diff tofu/

  tofu:validate:
    desc: tofu validate per tofu dir (modules + examples; init -backend=false, no state)
    cmd: |
      set -e
      # tests/fixtures/** are test INPUTS exercised via `tofu test` (run { module })
      # — partial stand-in modules (e.g. a colliding-catalog with no main.tf), not
      # standalone modules, so they are excluded from the validate/lint sweep.
      for m in $(find tofu -type f -name '*.tf' -not -path '*/tests/fixtures/*' -exec dirname {} \; | sort -u); do
        echo "=== validate ${m} ==="
        ( cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu validate )
      done

  tofu:lint:
    desc: tflint per tofu dir (modules + examples)
    cmd: |
      set -e
      # Excludes tests/fixtures/** — see tofu:validate rationale (test-input
      # stand-in modules, not standalone modules; a fixture symlinking the real
      # composition.tf without main.tf trips terraform_unused_declarations).
      for m in $(find tofu -type f -name '*.tf' -not -path '*/tests/fixtures/*' -exec dirname {} \; | sort -u); do
        echo "=== tflint ${m} ==="
        ( cd "$m" && tflint --chdir=. )
      done

  tofu:docs:
    desc: Regenerate module READMEs' input/output tables via terraform-docs
    cmd: |
      for m in {{.TOFU_MODULES}}; do
        terraform-docs markdown table --output-file README.md --output-mode inject "$m" || true
      done

  tofu:lint:yaml:
    desc: yamllint + markdownlint over tofu/ (module READMEs, example manifests)
    cmd: |
      yamllint -d relaxed tofu/ 2>/dev/null || true
      markdownlint 'tofu/**/*.md' || true

  tofu:check:render-determinism:
    # The #123 render-determinism fence — full rationale in scripts/check-render-determinism.sh.
    desc: "CI fence: Cilium/ArgoCD/CRD helm renders must use frozen terraform_data (ignore_changes), not live data.helm_template"
    cmd: scripts/check-render-determinism.sh

  tofu:test:
    desc: "tofu test — node-capability composition regression suite (dedup/determinism + hard-error guards). NETWORK: resolves the live Image Factory, so it is NOT part of tofu:ci (which stays offline)."
    cmd: |
      cd tofu/modules/talos-cluster && tofu init -input=false >/dev/null && tofu test

  tofu:ci:
    desc: Full local tofu validation (fmt-check + validate + lint + render-determinism fence) — mirrors CI
    cmds:
      - task: tofu:fmt:check
      - task: tofu:validate
      - task: tofu:lint
      - task: tofu:check:render-determinism

  # ===========================================================================
  # gitops:* — kustomize manifest validation + rendered-manifests pipeline
  # ===========================================================================
  gitops:validate:
    desc: kustomize-render + SOPS check + conftest + kubeconform + ArgoCD substrate invariants across all rendered manifests
    cmd: |
      set -e
      ./scripts/discover_kustomize_targets.sh
      ./scripts/render_kustomize_safe.sh
      ./scripts/verify_sops_files.sh
      ./scripts/run_conftest.sh
      for f in $(cat .work/kustomize-rendered-files.txt 2>/dev/null); do
        echo "kubeconform: $f"
        kubeconform -strict -ignore-missing-schemas "$f"
      done
      # conftest bite-check: the committed invalid-Application fixture must be
      # DENIED with each expected message — relaxing a source-classification/
      # pinning rule in policies/conftest/argocd.rego turns this red.
      if conftest test --all-namespaces --policy policies/conftest scripts/fixtures/argocd-invalid-applications.yaml >/dev/null 2>&1; then
        echo "ERROR: conftest bite-check — the invalid-Application fixture was not denied"; exit 1
      fi
      bite_out=$(conftest test --all-namespaces --policy policies/conftest scripts/fixtures/argocd-invalid-applications.yaml 2>&1 || true)
      for m in "must set chart (helm), path (git), ref (values anchor) or plugin" "helm block but neither chart nor path" "is floating"; do
        if ! printf '%s\n' "$bite_out" | grep -qF "$m"; then
          echo "ERROR: conftest bite-check — expected deny \"$m\" did not fire:"; printf '%s\n' "$bite_out"; exit 1
        fi
      done
      echo "conftest bite-check OK: all three source-classification/pinning denies fire"
      ./scripts/check-argocd-substrate-invariants.sh

  gitops:render-component:
    desc: 'Stage-1+2 render of one component. Usage: task gitops:render-component COMPONENT=<name>'
    cmd: |
      component='{{.COMPONENT | default ""}}'
      if [ -z "$component" ]; then echo "usage: task gitops:render-component COMPONENT=<name>"; exit 1; fi
      ./scripts/render-component.sh "$component"

  gitops:render-all:
    desc: Render every component that has a chart.lock.yaml
    cmd: |
      components="$(find kubernetes/base/infrastructure -mindepth 2 -maxdepth 2 -name chart.lock.yaml -exec dirname {} \; | xargs -n1 basename | sort)"
      if [ -z "$components" ]; then echo "no chart.lock.yaml files yet — nothing to render"; exit 0; fi
      for c in $components; do ./scripts/render-component.sh "$c"; done

  gitops:verify-rendered:
    desc: Re-render all components and fail if committed _rendered/ drifts
    cmd: ./scripts/verify-rendered.sh

  # ===========================================================================
  # bootstrap:* — consumer App-of-Apps root seed
  # ===========================================================================
  # ArgoCD itself (controller + namespace + sops-age-key Secret + CRDs) is
  # delivered by tofu/modules/talos-cluster as a Talos inlineManifest SEED
  # (deploy_argocd=true) + kubectl server-side CRDs — NOT by these tasks. The
  # bootstrap:argocd task only seeds the consumer-identity App-of-Apps root
  # (root-project + root-application), which the module does NOT deliver.
  bootstrap:render-root:
    internal: true
    cmd: |
      CLUSTER_NAME=$(yq -e '.cluster.name' {{.ENV}})
      REPO_URL=$(yq -e '.repo.url' {{.ENV}})
      OVERLAY=$(yq -e '.cluster.overlay' {{.ENV}})
      TARGET_REVISION=$(yq -e '.cluster.target_revision // "main"' {{.ENV}})
      for v in "$CLUSTER_NAME" "$REPO_URL" "$OVERLAY" "$TARGET_REVISION"; do
        case "$v" in *\$*) echo "ERROR: cluster.yaml value contains '\$' which is unsafe for envsubst: $v"; exit 1;; esac
      done
      # Label-safe form of the revision for app.kubernetes.io/version: a git
      # ref may carry '/' etc., but a label VALUE is limited to 63 chars of
      # [A-Za-z0-9_.-] with alphanumeric ends. spec.source.targetRevision
      # keeps the raw value.
      TARGET_REVISION_LABEL=$(printf '%s' "$TARGET_REVISION" | LC_ALL=C tr -c 'A-Za-z0-9_.-' '_' | cut -c1-63 | sed -e 's/^[^A-Za-z0-9]*//' -e 's/[^A-Za-z0-9]*$//')
      if [ -z "$TARGET_REVISION_LABEL" ]; then
        echo "ERROR: cluster.target_revision '$TARGET_REVISION' yields an empty label-safe value for app.kubernetes.io/version"; exit 1
      fi
      mkdir -p kubernetes/bootstrap/argocd/_out
      export CLUSTER_NAME REPO_URL OVERLAY TARGET_REVISION TARGET_REVISION_LABEL
      envsubst '$CLUSTER_NAME $REPO_URL $OVERLAY $TARGET_REVISION $TARGET_REVISION_LABEL' \
        < kubernetes/bootstrap/argocd/root-application.yaml.tmpl \
        > kubernetes/bootstrap/argocd/_out/root-application.yaml
      envsubst '$CLUSTER_NAME $REPO_URL $TARGET_REVISION_LABEL' \
        < kubernetes/bootstrap/argocd/root-project.yaml.tmpl \
        > kubernetes/bootstrap/argocd/_out/root-project.yaml

  bootstrap:argocd:
    desc: "Seed the consumer App-of-Apps root (root-project + root-application). Preconditions: deploy_argocd=true AND a completed `tofu apply` (it seeds ArgoCD + applies its CRDs server-side). Usage: task bootstrap:argocd [ENV=cluster.yaml]"
    deps: [bootstrap:render-root]
    # The waits restore the cross-context ordering barrier the removed
    # `argocd-install` helm-path kubectl-wait gave: BOTH ArgoCD CRDs (Application +
    # AppProject — the two root kinds) established + the server ready before the
    # root manifests are applied. `kubectl wait` errors NotFound on an absent
    # object, so existence is polled first; a persistent NotFound means
    # `tofu apply` did not finish its CRD step — recover with
    # `tofu apply -replace=null_resource.argocd_crds[0]`.
    cmds:
      - |
        for crd in applications.argoproj.io appprojects.argoproj.io; do
          echo "waiting for CRD $crd to exist + establish ..."
          for i in $(seq 1 60); do kubectl get crd "$crd" >/dev/null 2>&1 && break; sleep 2; done
          kubectl wait --for=condition=established "crd/$crd" --timeout=120s
        done
      - kubectl wait --for=condition=available -n argocd deployment/argocd-server --timeout=300s
      - kubectl apply -f kubernetes/bootstrap/argocd/_out/root-project.yaml
      - kubectl apply -f kubernetes/bootstrap/argocd/_out/root-application.yaml

  bootstrap:argocd-password:
    desc: Print the initial ArgoCD admin password (rotate after first login)
    cmd: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d && echo

  # ===========================================================================
  # cluster:* — declarative cluster SoT (cluster.yaml)
  # ===========================================================================
  cluster:init-yaml:
    desc: Copy cluster.yaml.example to cluster.yaml (gitignored declarative SoT) if absent
    cmd: |
      if [ ! -e cluster.yaml ]; then
        cp cluster.yaml.example cluster.yaml
        echo "Created cluster.yaml from cluster.yaml.example -- fill in your cluster values"
      fi

  # ===========================================================================
  # supply-chain:* — OCI artifact verification
  # ===========================================================================
  supply-chain:oci-allowlist:
    desc: Build the talos OCI tarball locally and diff against .ci-oci-tarball-expected.txt (fail-closed)
    # Allowlist-based (fail-closed) tarball verification. Builds locally per the
    # same logic as oci-publish.yml "Build tarball" + "Verify tarball contents".
    # Run before pushing a tag to confirm the fixture matches actual contents.
    cmd: |
      set -e
      [ -f .ci-oci-tarball-include.txt ] || { echo "ERROR: .ci-oci-tarball-include.txt not found"; exit 1; }
      [ -f .ci-oci-tarball-expected.txt ] || { echo "ERROR: .ci-oci-tarball-expected.txt not found"; exit 1; }
      mkdir -p .work
      tar -czf .work/oci-check.tar.gz --files-from=.ci-oci-tarball-include.txt
      tar -tzf .work/oci-check.tar.gz | sed 's|^\./||' | LC_ALL=C sort | sed 's|^|./|' > .work/oci-check-contents.txt
      if diff -u .ci-oci-tarball-expected.txt .work/oci-check-contents.txt; then
        echo "OK: tarball contents match .ci-oci-tarball-expected.txt"
      else
        echo "FAIL: tarball contents diverge from .ci-oci-tarball-expected.txt"
        echo "To update the fixture: mv .work/oci-check-contents.txt .ci-oci-tarball-expected.txt"
        exit 1
      fi
      rm -f .work/oci-check.tar.gz

  # ===========================================================================
  # knowledge:* — OKF knowledge bundle (knowledge/) authoring + validation
  # ===========================================================================
  knowledge:validate:
    desc: Validate the knowledge/ OKF bundle (openknowledge + offline link check)
    cmd: |
      set -e
      command -v openknowledge >/dev/null 2>&1 || { echo "ERROR: 'openknowledge' not installed — run 'task knowledge:install-cli'"; exit 1; }
      command -v lychee >/dev/null 2>&1 || { echo "ERROR: 'lychee' not installed — run 'task knowledge:install-cli'"; exit 1; }
      openknowledge validate knowledge/
      # Offline link-resolution gate: intra-repo markdown links must resolve.
      # Scope: the bundle, root orientation files, contracts/, and the two
      # tofu READMEs that ship in the OCI tarball and link into knowledge/.
      # CHANGELOG.md is a historical record and excluded by design.
      lychee --offline --no-progress --exclude-path CHANGELOG.md \
        'knowledge/**/*.md' './*.md' 'contracts/*.md' \
        'tofu/modules/talos-cluster/README.md' \
        'tofu/modules/talos-cluster/test/README.md'

  knowledge:new:
    desc: "Scaffold a new knowledge concept (usage: task knowledge:new FILE=reference/foo.md TYPE=reference)"
    requires:
      vars: [FILE, TYPE]
    cmd: |
      set -e
      target="knowledge/{{.FILE}}"
      [ -e "$target" ] && { echo "ERROR: $target already exists"; exit 1; }
      mkdir -p "$(dirname "$target")"
      printf -- '---\ntype: {{.TYPE}}\ntitle: TODO\ndescription: TODO one sentence.\ntags: [TODO]\ntimestamp: %s\nsources:\n  - TODO\n---\n\n# TODO\n' "$(date +%Y-%m-%d)" > "$target"
      echo "Created $target — fill frontmatter, then run 'task knowledge:validate'."

  knowledge:install-cli:
    desc: Install pinned openknowledge + lychee binaries into ~/.local/bin (checksum-verified)
    cmd: |
      set -e
      os="{{OS}}"; arch="{{ARCH}}"
      case "$os-$arch" in
        darwin-arm64) ok_sha="{{.OPENKNOWLEDGE_SHA256_DARWIN_ARM64}}"; ly_sha="{{.LYCHEE_SHA256_DARWIN_ARM64}}"; ok_asset="openknowledge_darwin_arm64.tar.gz"; ly_asset="lychee-aarch64-apple-darwin.tar.gz" ;;
        darwin-amd64) ok_sha="{{.OPENKNOWLEDGE_SHA256_DARWIN_AMD64}}"; ly_sha="{{.LYCHEE_SHA256_DARWIN_AMD64}}"; ok_asset="openknowledge_darwin_amd64.tar.gz"; ly_asset="lychee-x86_64-apple-darwin.tar.gz" ;;
        linux-amd64)  ok_sha="{{.OPENKNOWLEDGE_SHA256_LINUX_AMD64}}";  ly_sha="{{.LYCHEE_SHA256_LINUX_AMD64}}";  ok_asset="openknowledge_linux_amd64.tar.gz"; ly_asset="lychee-x86_64-unknown-linux-gnu.tar.gz" ;;
        *) echo "ERROR: unsupported platform $os-$arch — install openknowledge {{.OPENKNOWLEDGE_VERSION}} + lychee {{.LYCHEE_VERSION}} manually"; exit 1 ;;
      esac
      # sha256sum on Linux, shasum on macOS — match whichever is present so
      # the local path verifies with the same tool class as CI.
      if command -v sha256sum >/dev/null 2>&1; then shatool="sha256sum"; else shatool="shasum -a 256"; fi
      tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
      curl -fsSLo "$tmp/ok.tar.gz" "https://github.com/openknowledge-sh/openknowledge/releases/download/v{{.OPENKNOWLEDGE_VERSION}}/$ok_asset"
      echo "$ok_sha  $tmp/ok.tar.gz" | $shatool -c - >/dev/null
      tar -xzf "$tmp/ok.tar.gz" -C "$tmp"
      curl -fsSLo "$tmp/ly.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v{{.LYCHEE_VERSION}}/$ly_asset"
      echo "$ly_sha  $tmp/ly.tar.gz" | $shatool -c - >/dev/null
      tar -xzf "$tmp/ly.tar.gz" -C "$tmp"
      # lychee release tarballs nest the binary per-target (e.g.
      # lychee-aarch64-apple-darwin/lychee); openknowledge ships it flat.
      ly_bin="$(find "$tmp" -type f -name lychee | head -1)"
      [ -n "$ly_bin" ] || { echo "ERROR: lychee binary not found in release tarball"; exit 1; }
      mkdir -p "$HOME/.local/bin"
      install -m 0755 "$tmp/openknowledge" "$HOME/.local/bin/openknowledge"
      install -m 0755 "$ly_bin" "$HOME/.local/bin/lychee"
      # On a GitHub runner, ~/.local/bin is not guaranteed on PATH for
      # subsequent steps — persist it so later `task *:validate` steps
      # resolve the binaries. No-op outside GitHub Actions.
      [ -n "${GITHUB_PATH:-}" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      echo "Installed openknowledge $("$HOME/.local/bin/openknowledge" version) + lychee {{.LYCHEE_VERSION}} to ~/.local/bin"
      echo "Verify pins: task dev:verify-tools"

  # ===========================================================================
  # docs:* — repo-wide markdown linting (mirrors the docs-lint.yml CI job;
  # the workflow runs exactly these tasks so local == remote).
  # ===========================================================================
  docs:lint:
    desc: markdownlint over the whole repo (same invocation as CI)
    cmd: |
      set -e
      command -v markdownlint >/dev/null 2>&1 || { echo "ERROR: 'markdownlint' not installed — run 'task docs:install-cli'"; exit 1; }
      markdownlint '**/*.md' --ignore-path .markdownlintignore

  docs:install-cli:
    desc: Install the lockfile-pinned markdownlint-cli (npm ci, integrity-verified, lifecycle scripts disabled)
    deps: [dev:npm-ci]
    cmd: |
      set -e
      mkdir -p "$HOME/.local/bin"
      ln -sf "{{.ROOT_DIR}}/node_modules/.bin/markdownlint" "$HOME/.local/bin/markdownlint"
      [ -n "${GITHUB_PATH:-}" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      echo "Installed markdownlint $("$HOME/.local/bin/markdownlint" --version) (lockfile-pinned)"

  # ===========================================================================
  # spec:* — OpenSpec behavioral specs (openspec/). NOT the same tool as
  # knowledge:* (openknowledge validates the OKF bundle; openspec validates
  # behavioral capability specs). See knowledge/workflows/spec-driven-development.md.
  # ===========================================================================
  spec:validate:
    desc: Validate the openspec/ behavioral specs (strict + bite-check + source partition) + offline link check
    cmd: |
      set -e
      command -v openspec >/dev/null 2>&1 || { echo "ERROR: 'openspec' not installed — run 'task spec:install-cli'"; exit 1; }
      command -v lychee >/dev/null 2>&1 || { echo "ERROR: 'lychee' not installed — run 'task knowledge:install-cli'"; exit 1; }
      openspec validate --all --strict --no-interactive
      # Bite-check: the strict validator must reject a malformed
      # directly-authored spec (guards against a future openspec release
      # going warn-only). Runs against a temp COPY — the working tree is
      # never mutated, so interrupts and concurrent runs are safe.
      bitetmp="$(mktemp -d)"; trap 'rm -rf "$bitetmp"' EXIT
      cp -R openspec "$bitetmp/"
      mkdir -p "$bitetmp/openspec/specs/negative-fixture"
      cp scripts/fixtures/openspec-invalid-spec.md "$bitetmp/openspec/specs/negative-fixture/spec.md"
      if (cd "$bitetmp" && openspec validate --all --strict --no-interactive >/dev/null 2>&1); then
        echo "ERROR: strict validate passed a malformed spec — the gate no longer bites"; exit 1
      fi
      rm -rf "$bitetmp"; trap - EXIT
      # spec_lib parser red-green: the flow-style branches and the
      # declares-primary detector have no committed spec exercising them —
      # this unit test is their only binding.
      python3 scripts/test/test_spec_lib.py >/dev/null || { echo "ERROR: spec_lib parser self-test failed"; python3 scripts/test/test_spec_lib.py; exit 1; }
      # Source-ownership partition: exclusivity + completeness over the
      # enumerated substrate source universe (ADR-0015 ownership model).
      python3 scripts/check-spec-partition.py .
      lychee --offline --no-progress 'openspec/**/*.md'

  spec:install-cli:
    desc: Install the lockfile-pinned openspec CLI (npm ci, integrity-verified, lifecycle scripts disabled)
    deps: [dev:npm-ci]
    cmd: |
      set -e
      mkdir -p "$HOME/.local/bin"
      ln -sf "{{.ROOT_DIR}}/node_modules/.bin/openspec" "$HOME/.local/bin/openspec"
      [ -n "${GITHUB_PATH:-}" ] && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      echo "Installed openspec $("$HOME/.local/bin/openspec" --version) (lockfile-pinned)"
      echo "Verify pins: task dev:verify-tools"

  spec:check-regen:
    desc: Regeneration parity — the committed tool trees must equal the pinned generator's output
    cmd: |
      set -e
      command -v openspec >/dev/null 2>&1 || { echo "ERROR: 'openspec' not installed — run 'task spec:install-cli'"; exit 1; }
      # Refuse on dirty generated trees: --force would overwrite uncommitted
      # edits there, and a pre-dirty generated file would mask real drift in
      # the porcelain delta below.
      if [ -n "$(git status --porcelain .claude/ .codex/)" ]; then
        echo "ERROR: uncommitted changes under the generated trees — commit or discard them first."; exit 1
      fi
      # Delta over the WHOLE tree: catches modified, deleted AND newly-added
      # (untracked) files, wherever the generator writes them. Delta-based so
      # it also runs on a locally dirty tree (outside the generated trees);
      # on a pristine CI checkout the delta equals the absolute drift.
      # Scope note: this proves committed == pinned-generator output; it does
      # NOT prove the content is benign — instruction-body review stays
      # mandatory (ADR-0014; the trees are agent-loaded content).
      before="$(mktemp)"; after="$(mktemp)"; trap 'rm -f "$before" "$after"' EXIT
      git status --porcelain > "$before"
      openspec update --force >/dev/null
      git status --porcelain > "$after"
      if ! cmp -s "$before" "$after"; then
        echo "ERROR: regenerating with the pinned openspec changed the tree:"
        diff "$before" "$after" | grep '^>' || true
        exit 1
      fi
      echo "OK: committed tool trees match the pinned generator's output."

  spec:check-staleness:
    desc: "Staleness gate: a diff touching a spec's primary source must also touch the owning spec (escape: 'Spec-Impact: none' commit trailer). Usage: task spec:check-staleness [BASE=origin/main]"
    cmd: python3 scripts/check-spec-staleness.py --base '{{.BASE | default "origin/main"}}'

  spec:update:
    desc: Regenerate OpenSpec tool integrations (.claude/, .codex/) after a CLI upgrade
    cmd: |
      set -e
      command -v openspec >/dev/null 2>&1 || { echo "ERROR: 'openspec' not installed — run 'task spec:install-cli'"; exit 1; }
      # Completeness gate, DELTA-based: snapshot the ignored set before the
      # regeneration and fail only on paths the regeneration ADDED to it —
      # pre-existing operator/harness scratch under .claude/ (settings,
      # agents/, hooks/, ...) is expected and must stay ignored. A git
      # failure fails the task (the git call is separated from the greps
      # so a non-zero git exit is never swallowed as "clean").
      # NOTE: --force overwrites any uncommitted edits inside the generated
      # trees — commit or discard tree changes before running.
      before="$(mktemp)"; after="$(mktemp)"
      trap 'rm -f "$before" "$after" "$before.ign" "$after.ign"' EXIT
      git status --ignored=matching --porcelain .claude/ .codex/ > "$before"
      openspec update --force
      git status --ignored=matching --porcelain .claude/ .codex/ > "$after"
      grep '^!!' "$before" | sort > "$before.ign" || true
      grep '^!!' "$after"  | sort > "$after.ign"  || true
      new_ignored="$(comm -13 "$before.ign" "$after.ign")"
      rm -f "$before.ign" "$after.ign"
      if [ -n "$new_ignored" ]; then
        echo "ERROR: the regeneration emitted content that .gitignore ignores:"
        echo "$new_ignored"
        echo "Generated artifacts must be committed (ADR-0014) — extend the"
        echo "generated-subtree negations in .gitignore for THESE paths only."
        exit 1
      fi
      echo "Regenerated. Review the diff as security-relevant content (agent-"
      echo "loaded instructions, see ADR-0014) — then commit."

  # ===========================================================================
  # mcp:* — MCP server binary management (see knowledge/workflows/mcp-setup.md)
  # ===========================================================================
  mcp:install:
    desc: Install MCP server binaries (per-OS) and register wrapper symlink in ~/.local/bin
    cmd: |
      set -e
      command -v gh >/dev/null 2>&1 || { echo "ERROR: 'gh' (GitHub CLI) required — https://cli.github.com"; exit 1; }
      if [ "{{OS}}" = "darwin" ]; then
        command -v brew >/dev/null 2>&1 || { echo "ERROR: 'brew' required on macOS — https://brew.sh"; exit 1; }
        brew install github-mcp-server@{{.MCP_GITHUB_VERSION}} 2>/dev/null || brew install github-mcp-server
        brew install kubernetes-mcp-server@{{.MCP_K8S_VERSION}} 2>/dev/null || brew install kubernetes-mcp-server
        command -v npm >/dev/null 2>&1 || { echo "ERROR: 'npm' required for talos-mcp — https://nodejs.org"; exit 1; }
        npm install -g talos-mcp@{{.MCP_TALOS_VERSION}}
      else
        command -v go >/dev/null 2>&1 || { echo "ERROR: 'go' required on Linux for github-mcp-server — https://go.dev/dl"; exit 1; }
        go install github.com/github/github-mcp-server/cmd/github-mcp-server@v{{.MCP_GITHUB_VERSION}}
        command -v npm >/dev/null 2>&1 || { echo "ERROR: 'npm' required — https://nodejs.org"; exit 1; }
        npm install -g kubernetes-mcp-server@{{.MCP_K8S_VERSION}}
        npm install -g talos-mcp@{{.MCP_TALOS_VERSION}}
      fi
      mkdir -p "$HOME/.local/bin"
      ln -sf "{{.ROOT_DIR}}/scripts/mcp-github-wrapper.sh" "$HOME/.local/bin/mcp-github-wrapper"
      chmod +x "{{.ROOT_DIR}}/scripts/mcp-github-wrapper.sh"
      echo ""
      echo "Installed: $HOME/.local/bin/mcp-github-wrapper -> {{.ROOT_DIR}}/scripts/mcp-github-wrapper.sh"
      echo ""
      echo "Next steps:"
      echo "  1. Ensure \$HOME/.local/bin is in your PATH"
      echo "     Check: echo \$PATH | grep -q \$HOME/.local/bin && echo ok || echo 'ADD to PATH'"
      echo "  2. Run: gh auth login  (if not already authenticated)"
      echo "  3. Run: task mcp:verify"
      echo "  4. Restart Claude Code / Codex CLI"

  mcp:verify:
    desc: Verify MCP binaries, wrapper symlink, and gh auth state
    cmd: |
      fail=0
      for bin in gh github-mcp-server kubernetes-mcp-server talos-mcp mcp-github-wrapper; do
        if command -v "$bin" >/dev/null 2>&1; then
          echo "OK:      $bin -> $(command -v $bin)"
        else
          echo "MISSING: $bin — run 'task mcp:install'"; fail=1
        fi
      done
      if ! gh auth token >/dev/null 2>&1; then
        echo "FAIL:    gh auth token — run 'gh auth login'"; fail=1
      else
        echo "OK:      gh auth token (keychain accessible)"
      fi
      if [ "$fail" -eq 0 ]; then
        echo ""; echo "All checks passed. MCP servers ready."
      else
        echo ""; echo "One or more checks failed — fix above before starting Claude/Codex."; exit 1
      fi

  mcp:uninstall:
    desc: Remove MCP wrapper symlink from ~/.local/bin (leaves binaries in place)
    cmd: |
      if rm -f "$HOME/.local/bin/mcp-github-wrapper"; then
        echo "Removed $HOME/.local/bin/mcp-github-wrapper"
      else
        echo "$HOME/.local/bin/mcp-github-wrapper was not present"
      fi

  # ===========================================================================
  # dev:* — contributor hygiene
  # ===========================================================================
  dev:npm-ci:
    internal: true
    # `run: once` dedupes the install when several install-cli tasks run in
    # ONE task invocation (e.g. `task docs:install-cli spec:install-cli`).
    run: once
    cmd: |
      set -e
      command -v npm >/dev/null 2>&1 || { echo "ERROR: 'npm' required — https://nodejs.org"; exit 1; }
      npm ci --ignore-scripts

  dev:install-pre-commit:
    desc: Install pre-commit hooks and run them once across the repo
    cmd: |
      uvx pre-commit install
      uvx pre-commit run --all-files || true
      echo "pre-commit hooks installed. Run 'uvx pre-commit run --all-files' to validate the full repo."

  dev:verify-tools:
    desc: Confirm installed binaries match .tool-versions pins
    cmd: ./scripts/verify-tools.sh

  dev:verify-pins:
    desc: Assert the Taskfile vars block + package.json agree with .tool-versions (pin SoT)
    cmd: |
      set -eu
      command -v python3 >/dev/null 2>&1 || { echo "ERROR: python3 required for the package.json pin assertions"; exit 2; }
      fail=0
      tv() { awk -v k="$1" '$1==k {print $2}' .tool-versions; }
      # npm-distributed pins live in package.json (locked via
      # package-lock.json); python3 is used because the assert must run
      # BEFORE any install task (yq/jq availability is not guaranteed).
      pj() { python3 -c 'import json,sys; print(json.load(open("package.json"))["devDependencies"][sys.argv[1]])' "$1"; }
      assert() {
        if [ "$2" != "$3" ]; then
          echo "DRIFT: $1 .tool-versions=$2 other=$3"; fail=1
        else
          echo "OK:    $1 $2"
        fi
      }
      assert openknowledge "$(tv openknowledge)" "{{.OPENKNOWLEDGE_VERSION}}"
      assert lychee        "$(tv lychee)"        "{{.LYCHEE_VERSION}}"
      assert openspec      "$(tv openspec)"      "$(pj @fission-ai/openspec)"
      assert markdownlint  "$(tv markdownlint)"  "$(pj markdownlint-cli)"
      # Lockfile provenance: every resolved URL must point at the official
      # npm registry over https — a lockfile edit that redirects a transitive
      # dependency to another host (typo-squat tarball with a self-consistent
      # integrity hash) turns this red. Registry compromise stays out of
      # scope; the integrity hashes pin the fetch to the reviewed lockfile.
      if python3 -c 'import json,sys; d=json.load(open("package-lock.json"))["packages"]; bad=[(k,p["resolved"]) for k,p in d.items() if p.get("resolved") and not p["resolved"].startswith("https://registry.npmjs.org/")]; [print(f"DRIFT: package-lock.json {k} resolves outside registry.npmjs.org: {u}") for k,u in bad]; sys.exit(1 if bad else 0)'; then
        echo "OK:    package-lock.json — all resolved URLs on registry.npmjs.org"
      else
        fail=1
      fi
      exit "$fail"
