# OpenSSF Scorecard supply-chain risk analysis.
#
# Score is published to the OpenSSF API and surfaced as a README badge
# (https://api.securityscorecards.dev/projects/github.com/Nosmoht/talos-platform-base).
# SARIF results are uploaded to GitHub code-scanning for per-check
# triage.
#
# Spec: https://github.com/ossf/scorecard
# Recommended workflow template:
# https://github.com/ossf/scorecard-action#installation
#
# Actions are pinned to a full commit SHA per Scorecard's own
# `Pinned-Dependencies` check; the tag comment is informational only.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    # Weekly run, Tuesday 07:20 UTC. Drift-safe — the score is mostly
    # repo-config-dependent and changes slowly.
    - cron: "20 7 * * 2"
  push:
    branches: [main]

# Default: read-all; per-job permissions widen where Scorecard needs it.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # SARIF upload to code-scanning
      security-events: write
      # OIDC for the publish-to-OpenSSF-API path
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to OpenSSF Scorecard public API so the badge
          # served from api.securityscorecards.dev reflects this run.
          publish_results: true

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
