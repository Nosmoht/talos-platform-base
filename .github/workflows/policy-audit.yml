name: Policy Audit

# Runs scripts/preflight-checks.sh with a GitHub App token that can read branch
# protection and repository settings. The PR-attached `preflight` job runs the
# same script with the default GITHUB_TOKEN, which cannot read those and skips
# the checks that depend on them -- it reports success without having looked.
# This workflow is where Check 1 and Check 4 are enforcing.
#
# Deliberately not PR-attached: the script asserts account policy, never the
# diff, and a PR job checks out the pull request's own tree. An App token has no
# business in a job that runs code from a pull request.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  policy-audit:
    name: policy-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          # App ID is stored as a secret rather than a variable here; it is not
          # sensitive, but the pairing with the key is what matters.
          app-id: ${{ secrets.PREFLIGHT_APP_ID }}
          private-key: ${{ secrets.PREFLIGHT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run preflight checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/preflight-checks.sh
