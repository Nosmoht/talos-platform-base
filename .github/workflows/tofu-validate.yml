name: tofu-validate

# Validates the OpenTofu cluster-lifecycle module (tofu/modules/talos-cluster)
# and its examples — the substrate base's sole Talos provisioning path. Mirrors
# the local `task tofu:ci` (fmt-check + validate + lint) so CI and workstation agree.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'Taskfile.yml'
      - '.github/workflows/tofu-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'Taskfile.yml'
      - '.github/workflows/tofu-validate.yml'

permissions:
  contents: read

jobs:
  tofu-validate:
    name: tofu-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.12.1'
          tofu_wrapper: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          # Pinned to the devbox-locked version (devbox.lock) so CI and local
          # `task tofu:ci` use the same tflint; an unrelated ruleset bump can't turn CI red.
          tflint_version: v0.61.0

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task tofu:ci (fmt-check + validate + lint)
        run: task tofu:ci

  tofu-test:
    name: tofu-test (composition guard-regression suite)
    runs-on: ubuntu-latest
    # ADVISORY by default: this job calls the live Talos Image Factory, so an
    # upstream outage can red it independently of the diff. Do NOT add it to
    # branch-protection *required* checks unless you accept that a factory.talos.dev
    # outage will block all tofu/** merges. timeout-minutes bounds a hung connect.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.12.1'
          tofu_wrapper: false

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # NETWORK: `tofu test` resolves the live Talos Image Factory (schematic
      # dedup proof), so it is deliberately excluded from the offline `task tofu:ci`.
      # This dedicated job is the CI enforcement of the node-capability
      # composition guard-regression suite — the ADR §"Falsification criteria"
      # (each hard-error guard fires red-green, dedup determinism holds). Without
      # it those guards can regress silently with `task tofu:ci` still green.
      # An Image-Factory outage (factory.talos.dev unreachable) can red this job
      # independently of the diff — re-run on transient infra blips.
      - name: task tofu:test (hard-error guards + dedup determinism — live Image Factory)
        run: task tofu:test
