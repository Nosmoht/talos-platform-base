name: tofu-validate

# Validates the OpenTofu cluster-lifecycle module (tofu/modules/talos-cluster)
# and its examples — the substrate base's sole Talos provisioning path. Mirrors
# the local `task tofu:ci` (fmt-check + validate + lint) so CI and workstation agree.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'Taskfile.yml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/tofu-validate.yml'
      - '.ci-oci-tarball-include.txt'
      - '.ci-oci-tarball-expected.txt'
      # tofu:ci is the ONLY runner of these fences, so a PR touching just a
      # fence script must still execute it — otherwise a weakening edit to the
      # guard merges without the guard ever running (#218 review).
      - 'scripts/check-render-determinism.sh'
      - 'scripts/check-argocd-day0-apply-shape.sh'
      - 'scripts/check-argocd-gate-bites.sh'
      - 'scripts/check-kubeconfig-endpoint-regen.sh'
      - 'scripts/check-node-projection-wiring.sh'
      - 'scripts/check-module-readme-parity.sh'
      - 'scripts/check-shim-key-parity.sh'
      - 'scripts/check-cilium-operator-replicas-key.sh'
      - 'scripts/check-cilium-rollout-pods-key.sh'
      - 'scripts/check-talos-config-validation.sh'
      - 'scripts/check-provider-document-kinds.sh'
      - 'scripts/check-provider-document-kinds-bites.sh'
      - 'scripts/check-substrate-consumability.sh'
      # tofu:ci carries check:shim-key-parity, which reads the schema. Without
      # this entry a schema-only widening — the exact diff shape that leaves a
      # new substrate key unmapped in the shim — would not run the gate at all.
      - 'schemas/cluster.schema.json'
      # tofu:ci carries check:cilium-rollout-pods-key, which reads the Day-2
      # reference values as well as the module floor. Without this entry a
      # reference-only edit dropping rollOutCiliumPods would bypass the fence
      # added to catch exactly that.
      - 'kubernetes/bootstrap/cilium/values.yaml'
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'Taskfile.yml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/tofu-validate.yml'
      - '.ci-oci-tarball-include.txt'
      - '.ci-oci-tarball-expected.txt'
      # tofu:ci is the ONLY runner of these fences, so a PR touching just a
      # fence script must still execute it — otherwise a weakening edit to the
      # guard merges without the guard ever running (#218 review).
      - 'scripts/check-render-determinism.sh'
      - 'scripts/check-argocd-day0-apply-shape.sh'
      - 'scripts/check-argocd-gate-bites.sh'
      - 'scripts/check-kubeconfig-endpoint-regen.sh'
      - 'scripts/check-node-projection-wiring.sh'
      - 'scripts/check-module-readme-parity.sh'
      - 'scripts/check-shim-key-parity.sh'
      - 'scripts/check-cilium-operator-replicas-key.sh'
      - 'scripts/check-cilium-rollout-pods-key.sh'
      - 'scripts/check-talos-config-validation.sh'
      - 'scripts/check-provider-document-kinds.sh'
      - 'scripts/check-provider-document-kinds-bites.sh'
      - 'scripts/check-substrate-consumability.sh'
      # tofu:ci carries check:shim-key-parity, which reads the schema. Without
      # this entry a schema-only widening — the exact diff shape that leaves a
      # new substrate key unmapped in the shim — would not run the gate at all.
      - 'schemas/cluster.schema.json'
      # tofu:ci carries check:cilium-rollout-pods-key, which reads the Day-2
      # reference values as well as the module floor. Without this entry a
      # reference-only edit dropping rollOutCiliumPods would bypass the fence
      # added to catch exactly that.
      - 'kubernetes/bootstrap/cilium/values.yaml'

permissions:
  contents: read

jobs:
  tofu-validate:
    name: tofu-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: aqua:opentofu/opentofu aqua:terraform-linters/tflint aqua:go-task/task aqua:siderolabs/talos aqua:helm/helm aqua:mikefarah/yq aqua:jqlang/jq

      - name: task tofu:ci (fmt-check + validate + lint)
        run: task tofu:ci

  tofu-test:
    name: tofu-test (composition guard-regression suite)
    runs-on: ubuntu-latest
    # ADVISORY by default: this job pulls the argo-cd and cilium Helm charts, so
    # an outage of a chart repository can red it independently of the diff. The
    # Image Factory's live check is image-factory-live.yml. timeout-minutes
    # bounds a hung connect.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: aqua:opentofu/opentofu aqua:go-task/task

      # NETWORK: `tofu test` renders the seed charts, so it is deliberately
      # excluded from the offline `task tofu:ci`. This dedicated job is the CI
      # enforcement of the node-capability composition guard-regression suite —
      # the ADR §"Falsification criteria" (each hard-error guard fires red-green,
      # dedup determinism holds). Without it those guards can regress silently
      # with `task tofu:ci` still green.
      # Any suite that still reaches the Factory fails here on every run,
      # instead of only during a Factory outage.
      - name: Block the Talos Image Factory
        run: echo "0.0.0.0 factory.talos.dev" | sudo tee -a /etc/hosts

      - name: task tofu:test (hard-error guards + dedup determinism)
        run: task tofu:test
