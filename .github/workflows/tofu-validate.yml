name: tofu-validate

# Validates the OpenTofu cluster-lifecycle module (tofu/modules/talos-cluster)
# and its examples — the substrate base's sole Talos provisioning path. Mirrors
# the local `task ci` (fmt-check + validate + lint) so CI and workstation agree.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'Taskfile.yml'
      - '.github/workflows/tofu-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'tofu/**'
      - 'Taskfile.yml'
      - '.github/workflows/tofu-validate.yml'

permissions:
  contents: read

jobs:
  tofu-validate:
    name: tofu-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.12.1'
          tofu_wrapper: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task ci (fmt-check + validate + lint)
        run: task ci
