name: GitOps Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: aqua:helm/helm aqua:kubernetes-sigs/kustomize aqua:open-policy-agent/conftest aqua:yannh/kubeconform aqua:mikefarah/yq aqua:BurntSushi/ripgrep

      - name: Verify rendered manifests are reproducible (drift gate)
        # Phase B re-render gate: re-runs scripts/render-component.sh for
        # every component with a chart.lock.yaml in a tmpdir and diffs
        # against the committed _rendered/ tree. Drift = build fails.
        # This is the load-bearing guarantee that committed _rendered/
        # YAML is reproducible from chart.lock.yaml + values.yaml +
        # _rendered-overlay/. Without this gate, a developer could
        # hand-edit the committed output and the change would silently
        # ship to consumer clusters.
        run: ./scripts/verify-rendered.sh

      - name: Check shared ArgoCD substrate invariants (both render paths)
        # Gates the shared bootstrap/steady-state invariants (identity-free
        # defaults and the exact NetworkPolicy posture) across BOTH the tofu
        # bootstrap seed values and the steady-state values — rendering each
        # fresh with the pinned chart. Closes the silent-drift class from #153.
        # Uses the helm + yq already installed above; runs on every PR.
        run: ./scripts/check-argocd-substrate-invariants.sh

      - name: Prove the ArgoCD NetworkPolicy gate bites
        # Mutates copies of the real committed render and requires I6 to reject
        # empty/wrong selectors, unsafe ingress drift and a missing policy.
        run: ./scripts/check-argocd-network-policy-gate-bites.sh

      - name: Prove the ArgoCD image gate bites
        # Mutates copies of the real committed render and requires I7 to reject
        # another tag, another repository, a digest and a render without the image.
        run: ./scripts/check-argocd-image-gate-bites.sh

      - name: Check Cilium reference values against the pinned chart schema
        # kubernetes/bootstrap/cilium/values.yaml ships in the OCI artifact and is
        # what a consumer copies into a Day-2 self-managed Application, but nothing
        # ever rendered it — so a value the pinned chart REMOVED was dropped
        # silently by Helm (no --strict), leaving the consumer misconfigured with no
        # error. That is what happened to encryption.strictMode.* at Cilium 1.20.
        # Same script `task gitops:validate` runs, so local green means what CI
        # green means. Uses the yq installed above; needs the chart registry, and
        # SKIPS loudly rather than failing when it is unreachable — an outage must
        # not block unrelated merges (same trade-off tofu-validate.yml makes).
        run: ./scripts/check-cilium-reference-values.py

      - name: Discover kustomize targets
        run: ./scripts/discover_kustomize_targets.sh

      - name: Render safe kustomize targets
        run: ./scripts/render_kustomize_safe.sh

      - name: Verify rendered set matches .ci-renderable-components.txt
        run: |
          set -eu
          if [ ! -f .ci-renderable-components.txt ]; then
            echo "error: .ci-renderable-components.txt missing — frozen ground-truth list required"
            exit 1
          fi
          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          sort -u < .ci-renderable-components.txt > "$expected_file"
          awk -F/ '$2 == "substrate" {print $3}' \
              .work/kustomize-safe-targets.txt 2>/dev/null \
            | sort -u > "$actual_file"
          if ! cmp -s "$expected_file" "$actual_file"; then
            echo "error: rendered base-component set != .ci-renderable-components.txt"
            echo "--- expected ---"
            cat "$expected_file"
            echo "--- actual ---"
            cat "$actual_file"
            echo "--- diff ---"
            diff "$expected_file" "$actual_file" || true
            rm -f "$expected_file" "$actual_file"
            exit 1
          fi
          count="$(wc -l < "$expected_file" | tr -d ' ')"
          rm -f "$expected_file" "$actual_file"
          echo "ok: rendered set matches .ci-renderable-components.txt ($count components)"

      - name: Check required CLI tools
        run: |
          set -eu
          command -v yq >/dev/null 2>&1 || { echo "error: yq is required but not installed"; exit 1; }

      - name: Kubeconform rendered manifests
        run: |
          set -eu
          if [ ! -f .work/kustomize-rendered-files.txt ]; then
            echo "notice: rendered file list not found, skipping kubeconform"
            exit 0
          fi

          count=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            count=$((count + 1))
            echo "kubeconform: $f"
            kubeconform -strict -ignore-missing-schemas "$f"
          done < .work/kustomize-rendered-files.txt

          echo "kubeconform tested files: $count"

      - name: Conftest policy checks
        run: ./scripts/run_conftest.sh

      - name: Upload diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitops-validate-diagnostics
          path: |
            .work/

  hardware-features-check:
    name: Hardware-features registry validation (Layer C)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: aqua:mikefarah/yq aqua:go-task/task aqua:kubernetes-sigs/kustomize

      - name: Install check-jsonschema (for Layer-C schema lint)
        run: |
          set -eu
          python3 -m pip install --user check-jsonschema
          # Ensure the user-site bin dir is on PATH for subsequent steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint Layer-C hardware-features registry schema
        run: scripts/lint-hardware-features.sh

      - name: Check provisioning-catalog provides == registry talos-machine-config atoms (γ' composition)
        run: scripts/check-provisioning-catalog-refs.sh

      - name: Lint consumer cluster.yaml schema (example)
        run: scripts/lint-cluster-yaml.sh cluster.yaml.example

      - name: Lint consumer cluster.yaml schema (module worked example)
        run: scripts/lint-cluster-yaml.sh tofu/modules/talos-cluster/examples/complete/cluster.yaml

      - name: Reject malformed cluster.yaml fixture (schema red-green)
        run: |
          set -u
          # Discriminate exit 1 (schema violation — the assertion) from exit 2
          # (env/arg error — schema/file missing, no check-jsonschema). Treating
          # any non-zero as "rejected" lets a broken toolchain pass vacuously.
          rc=0
          out=$(scripts/lint-cluster-yaml.sh schemas/fixtures/cluster.invalid.yaml 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: malformed cluster.yaml fixture passed schema validation" >&2
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "FAIL: linter errored (exit $rc), did not reach a schema verdict" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          # Bind all NINETEEN schema rules individually (fourteen fixture entries —
          # operator_replicas: 0.5 breaks two at once and values_path breaks the
          # three path-normalization sub-rules): relaxing the role
          # enum, the node-key pattern (issue #204 — a key Talos would ACCEPT and
          # silently rewrite), de-anchoring the version pattern, or relaxing any
          # of the four kernel-arg lexical rules (issue #169) must each turn this
          # step red, even while the other violations still fail the file.
          # The node-key needle carries the offending VALUE, not just the path:
          # "$.nodes" alone is a prefix of "$.nodes['cp-1'].role" and would pass
          # vacuously on the role violation after the key rule was relaxed.
          for v in "\$.nodes['cp-1'].role" "\$.nodes: 'CP_2'" '$.talos.install_version' \
            "\$.images['bad-karg-whitespace'].extra_kernel_args[0]" \
            "\$.images['bad-karg-removal'].extra_kernel_args[0]" \
            "\$.images['bad-karg-empty-key'].extra_kernel_args[0]" \
            "\$.images['bad-karg-debugfs'].extra_kernel_args[0]" \
            '$.substrate.cilium.agent_metric_overrides[0]' \
            '$.substrate.cilium.hubble_metrics[1]' \
            '$.substrate.cilium.native_routing_cidr' \
            "\$.substrate.cilium.operator_replicas: 0.5 is not of type" \
            "\$.substrate.cilium.operator_replicas: 0.5 is less than the minimum" \
            "\$.substrate.cilium.k8s_service_host: '[2001:db8::1]'" \
            '$.substrate.cilium.k8s_service_port' \
            "'title': 'no-parent-segment'" \
            "'title': 'no-dot-segment'" \
            "'title': 'no-doubled-separator'" \
            '$.substrate.cilium.self_management_values_source.override_path' \
            "\$.cluster.worker_apply_mode: 'staged_if_needing_reboot' is not one of"; do
            if ! printf '%s\n' "$out" | grep -qF "$v"; then
              echo "FAIL: expected schema violation on $v was not reported — that rule no longer bites" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
          done
          echo "OK: malformed cluster.yaml fixture rejected with all nineteen expected violations (role enum + node-key pattern + anchored version pattern + four kernel-arg lexical rules + three Cilium raw-render corruption rules + both operator_replicas numeric bounds + both API-server endpoint patterns + the three values_path normalization sub-rules + the override_path charset rule)"

      - name: task bootstrap:check-render (bootstrap render ↔ argocd-day-zero-bootstrap spec)
        # The mechanical binding for the render's spec scenarios: the subset it
        # reads, the `main` default, and the containment guards — none of which
        # are visible in the rendered output for well-formed input, so nothing
        # else in CI would catch their removal. Offline: the render is yq +
        # envsubst; kubectl lives only in bootstrap:argocd's own cmds.
        run: task bootstrap:check-render

  reuse-compliance:
    name: REUSE 3.3 compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: REUSE lint
        # https://reuse.software/spec/ — every file must carry SPDX
        # licence + copyright metadata, either inline or via REUSE.toml.
        # Aggregate annotation at repo root covers all Apache-2.0 files;
        # _rendered/ output of upstream Helm charts is marked
        # LicenseRef-UpstreamHelm — see LICENSES/LicenseRef-UpstreamHelm.txt.
        uses: fsfe/reuse-action@v5

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: aqua:gitleaks/gitleaks

      - name: Run gitleaks (full history)
        # --config: pin shared .gitleaks.toml so this scan and the
        # pre-commit hook cannot drift across the project lifecycle.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1 --no-banner

  oci-allowlist-check:
    name: OCI Allowlist Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: aqua:mikefarah/yq

      - name: Verify OCI tarball allowlist matches expected fixture
        # Builds the talos OCI tarball locally from .ci-oci-tarball-include.txt
        # and diffs against the committed .ci-oci-tarball-expected.txt fixture.
        # Catches accidental additions or removals before a tag fires the publish
        # workflow. Allowlist is fail-closed: any path not listed is excluded.
        run: |
          set -euo pipefail
          [ -f .ci-oci-tarball-include.txt ] || { echo "::error::.ci-oci-tarball-include.txt missing"; exit 1; }
          [ -f .ci-oci-tarball-expected.txt ] || { echo "::error::.ci-oci-tarball-expected.txt missing"; exit 1; }
          mkdir -p .work
          tar -czf .work/oci-check.tar.gz --files-from=.ci-oci-tarball-include.txt
          tar -tzf .work/oci-check.tar.gz | sed 's|^\./||' | LC_ALL=C sort | sed 's|^|./|' > .work/oci-check-contents.txt
          if diff -u .ci-oci-tarball-expected.txt .work/oci-check-contents.txt; then
            echo "OK: tarball contents match .ci-oci-tarball-expected.txt"
          else
            echo "::error::Tarball contents diverge from .ci-oci-tarball-expected.txt"
            echo "To update the fixture: mv .work/oci-check-contents.txt .ci-oci-tarball-expected.txt"
            exit 1
          fi

      - name: Renderable substrate components are consumable + kubernetes/base stays retired
        # Shared script with `task supply-chain:oci-allowlist` — closes the
        # #156 class (renderable-but-unlisted component) and enforces the
        # ADR-0024 layout invariant mechanically.
        run: ./scripts/check-substrate-consumability.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: aqua:koalaman/shellcheck
      - name: Run ShellCheck (-S warning) over all tracked shell scripts
        run: |
          set -euo pipefail
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 -r shellcheck -S warning
