name: Publish OCI artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write       # cosign keyless OIDC
  attestations: write   # actions/attest-build-provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Login to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build tarball
        # Allowlist-driven (fail-closed): only files listed in
        # .ci-oci-tarball-include.txt are packaged. This replaces the
        # former REQUIRED/OPTIONAL inline array approach so the tarball
        # membership is version-controlled and reviewable alongside the
        # code it ships. Supply-chain hygiene rule: allowlist beats
        # blocklist — any path not listed here is excluded by default.
        #
        # To add or remove files: edit .ci-oci-tarball-include.txt and
        # update .ci-oci-tarball-expected.txt accordingly; the "Verify
        # tarball contents" step below will catch any divergence.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release
          [ -f .ci-oci-tarball-include.txt ] || {
            echo "::error::.ci-oci-tarball-include.txt missing — cannot build tarball"
            exit 1
          }
          tar -czf "_release/talos-platform-base-${{ steps.tag.outputs.tag }}.tar.gz" \
            --files-from=.ci-oci-tarball-include.txt

      - name: Verify tarball contents
        # Catch the class of regression where an excluded path is
        # accidentally included (or vice versa) — diff against an
        # expected fixture committed to the repo.
        run: |
          set -euo pipefail
          mkdir -p .work
          tar -tzf "_release/talos-platform-base-${{ steps.tag.outputs.tag }}.tar.gz" \
            | sed 's|^\./||' | LC_ALL=C sort | sed 's|^|./|' > .work/tarball-contents.txt
          if [ -f .ci-oci-tarball-expected.txt ]; then
            if ! diff -u .ci-oci-tarball-expected.txt .work/tarball-contents.txt; then
              echo "::error::Tarball contents diverge from .ci-oci-tarball-expected.txt"
              echo "If the divergence is intentional, update the fixture: \`mv .work/tarball-contents.txt .ci-oci-tarball-expected.txt\`"
              exit 1
            fi
          else
            echo "::notice::No .ci-oci-tarball-expected.txt fixture present; skipping diff. Run \`mv .work/tarball-contents.txt .ci-oci-tarball-expected.txt\` to lock it in."
          fi

      - name: Verify renderer executable bit preserved
        # AC4: render-cilium-bootstrap.sh must ship with its OWNER-exec bit
        # intact so Consumers can invoke it directly after `oras pull`.
        # GNU stat is available on ubuntu-latest (this workflow only ever
        # runs on ubuntu-latest); umask 022 preserves the 0111 exec bits.
        # Extract the whole (tiny) tarball to avoid GNU-tar `--wildcards`
        # and a multiline `find`; the stored path is the include.txt entry,
        # which the `Verify tarball contents` step already normalized.
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "_release/talos-platform-base-${{ steps.tag.outputs.tag }}.tar.gz" -C "$tmp"
          f="$tmp/scripts/render-cilium-bootstrap.sh"
          [ -f "$f" ] || f="$tmp/./scripts/render-cilium-bootstrap.sh"
          [ -f "$f" ] || { echo "::error::render-cilium-bootstrap.sh not found in tarball"; exit 1; }
          mode="$(stat -c '%a' "$f")"
          echo "render-cilium-bootstrap.sh mode in tarball: $mode"
          # Owner-exec bit (0100) must be set; 8#$mode is safe for 3- and
          # 4-digit (special-bit) octal modes, and `set -e` aborts earlier
          # if `stat` failed (mode never empty here).
          if (( (8#$mode & 8#100) == 0 )); then
            echo "::error::render-cilium-bootstrap.sh lost its executable bit in the OCI tarball (mode=$mode)"
            exit 1
          fi

      - name: Generate checksums
        working-directory: _release
        run: sha256sum *.tar.gz > checksums.txt

      - name: Push OCI artifact
        id: push
        working-directory: _release
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          oras push \
            "ghcr.io/${OWNER_LC}/talos-platform-base:${{ steps.tag.outputs.tag }}" \
            --artifact-type "application/vnd.talos-platform-base.v1+tar" \
            "talos-platform-base-${{ steps.tag.outputs.tag }}.tar.gz:application/gzip" \
            "checksums.txt:text/plain"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Capture artifact digest
        id: digest
        run: |
          set -euo pipefail
          OWNER_LC='${{ steps.push.outputs.owner_lc }}'
          DIGEST=$(oras manifest fetch --descriptor \
            "ghcr.io/${OWNER_LC}/talos-platform-base:${{ steps.tag.outputs.tag }}" \
            | jq -r .digest)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::failed to capture artifact digest after oras push"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Captured digest: $DIGEST"

      - name: cosign sign (keyless OIDC)
        # Anchors signing to the workflow's GitHub OIDC token identity
        # (the workflow ref, the repository, and the tag pattern).
        # Verify command + identity regex documented in
        # docs/oci-artifact-verification.md.
        run: |
          set -euo pipefail
          OWNER_LC='${{ steps.push.outputs.owner_lc }}'
          cosign sign --yes \
            "ghcr.io/${OWNER_LC}/talos-platform-base@${{ steps.digest.outputs.digest }}"

      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ steps.push.outputs.owner_lc }}/talos-platform-base
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (CycloneDX 1.6, JSON)
        # Inventory of every file shipped in the OCI tarball, attached as
        # an in-toto attestation in the next step. REUSE 3.3 metadata
        # (LICENSES/, REUSE.toml) drives per-file licence attribution.
        # CycloneDX 1.6 chosen over SPDX 3.0: broader OCI/cosign tooling
        # maturity in 2026 (Syft, Trivy, cosign attest --type cyclonedx
        # all native; SPDX 3.0 still gated behind opt-in flags).
        # Spec: https://cyclonedx.org/specification/overview/
        uses: anchore/sbom-action@v0.17.9
        with:
          file: _release/talos-platform-base-${{ steps.tag.outputs.tag }}.tar.gz
          format: cyclonedx-json
          output-file: _release/talos-platform-base-${{ steps.tag.outputs.tag }}.cdx.json
          upload-artifact: false

      - name: cosign attest SBOM
        # Attaches the SBOM as a cosign attestation keyed to the OCI digest.
        # Consumers verify via:
        #   cosign verify-attestation --type cyclonedx \
        #     --certificate-identity-regexp <pattern> \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     ghcr.io/<owner>/talos-platform-base:<tag>
        run: |
          set -euo pipefail
          OWNER_LC='${{ steps.push.outputs.owner_lc }}'
          cosign attest --yes \
            --type cyclonedx \
            --predicate "_release/talos-platform-base-${{ steps.tag.outputs.tag }}.cdx.json" \
            "ghcr.io/${OWNER_LC}/talos-platform-base@${{ steps.digest.outputs.digest }}"

      - name: Tag :latest
        # Skip on SemVer pre-release tags (`v*-*`). Pre-release artifacts
        # must not become the default that consumers pin to via `:latest`.
        # Caveat: a tag like `v1.0.0-final` is also skipped — official
        # SemVer §9 treats any hyphenated suffix as a pre-release
        # identifier, so this matches the spec.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          oras tag \
            "ghcr.io/${OWNER_LC}/talos-platform-base:${{ steps.tag.outputs.tag }}" \
            latest
