name: docs-lint

# No paths: filter — deliberately runs on every PR/push. Two reasons:
# (1) the offline link gate checks links whose TARGETS are non-markdown
#     files (scripts, schemas, contracts) — a PR deleting a target without
#     touching *.md must still trigger the gate;
# (2) an unfiltered job is safe to promote to a required branch-protection
#     context later (a path-filtered required check hangs non-matching PRs
#     as "Expected — waiting"). The job is cheap (~seconds).
#
# Contract: every check step runs a Taskfile target, never inline shell —
# the identical chain is runnable locally (`task docs:lint`,
# `task knowledge:validate`, `task spec:validate`, `task spec:check-regen`,
# `task dev:verify-pins`). Tool pins live in .tool-versions + the Taskfile
# vars block only; `dev:verify-pins` asserts the pair.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the staleness gate diffs against the PR base ref.
          fetch-depth: 0

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          # KEEP IN SYNC with the `task` pin in .tool-versions — the task
          # binary is the executor of every check below; a floating 3.x
          # would reintroduce local-vs-CI drift at the executor level.
          version: 3.48.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task dev:verify-pins (Taskfile vars ↔ .tool-versions)
        run: task dev:verify-pins

      - name: task install-cli (markdownlint + openspec via npm ci lockfile; openknowledge + lychee pinned + checksum)
        # One task invocation so the shared `npm ci --ignore-scripts`
        # (dev:npm-ci, run: once) executes exactly once for both npm tools.
        run: task docs:install-cli spec:install-cli knowledge:install-cli

      - name: task docs:lint
        run: task docs:lint

      - name: task knowledge:validate
        # knowledge/openknowledge.toml raises link-target to error, so a
        # broken or bundle-escaping link fails this step (exit 1).
        run: task knowledge:validate

      - name: task spec:validate
        # Strict validate + bite-check (malformed fixture must fail) +
        # source-ownership partition + offline link pass.
        run: task spec:validate

      - name: task spec:check-regen
        # Committed tool trees must equal the pinned generator's output
        # (whole-tree delta; catches added/modified/deleted files). Parity
        # only — instruction-body review stays mandatory (ADR-0014).
        run: task spec:check-regen

      - name: task spec:check-staleness (PR only)
        # ADR-0015 staleness convention, CI-enforced: a PR touching a
        # spec's primary source must also touch the owning spec. Escape
        # for verified no-behavior-change diffs: the 'Spec-Impact: none'
        # trailer on EVERY commit touching the file (per-commit scope;
        # reviewer judges the claim).
        if: github.event_name == 'pull_request'
        env:
          # env-bound (not inline-interpolated into `run:`): github.base_ref
          # is on GitHub's untrusted-input list — inline expansion would let
          # a metacharacter-named base branch inject into the runner shell.
          BASE_REF: ${{ github.base_ref }}
        run: task spec:check-staleness BASE="origin/${BASE_REF}"
