name: docs-lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
      - '.markdownlintignore'
      - '.github/workflows/docs-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.yaml'
      - '.markdownlintignore'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.42.0

      - name: Lint Markdown
        run: markdownlint '**/*.md' --ignore-path .markdownlintignore
