name: docs-lint

# No paths: filter — deliberately runs on every PR/push. Two reasons:
# (1) the offline link gate checks links whose TARGETS are non-markdown
#     files (scripts, schemas, contracts) — a PR deleting a target without
#     touching *.md must still trigger the gate;
# (2) an unfiltered job is safe to promote to a required branch-protection
#     context later (a path-filtered required check hangs non-matching PRs
#     as "Expected — waiting"). The job is cheap (~seconds).
#
# Contract: every check step runs a Taskfile target, never inline shell —
# the identical chain is runnable locally (`task docs:lint`,
# `task knowledge:validate`, `task spec:validate`, `task spec:check-regen`,
# `task dev:verify-pins`). Tool pins live in .tool-versions + the Taskfile
# vars block only; `dev:verify-pins` asserts the pair.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task dev:verify-pins (Taskfile vars ↔ .tool-versions)
        run: task dev:verify-pins

      - name: task docs:install-cli (markdownlint, pinned)
        run: task docs:install-cli

      - name: task knowledge:install-cli (openknowledge + lychee, pinned + checksum)
        run: task knowledge:install-cli

      - name: task spec:install-cli (openspec, pinned, lifecycle scripts disabled)
        run: task spec:install-cli

      - name: task docs:lint
        run: task docs:lint

      - name: task knowledge:validate
        # knowledge/openknowledge.toml raises link-target to error, so a
        # broken or bundle-escaping link fails this step (exit 1).
        run: task knowledge:validate

      - name: task spec:validate
        # Strict validate + bite-check (malformed fixture must fail) +
        # source-ownership partition + offline link pass.
        run: task spec:validate

      - name: task spec:check-regen
        # Committed tool trees must equal the pinned generator's output
        # (whole-tree delta; catches added/modified/deleted files). Parity
        # only — instruction-body review stays mandatory (ADR-0014).
        run: task spec:check-regen
