name: Release

# Conventional-commit-driven, fully automated releases — no human approval step.
#
# Flow: a push to `main` runs `plan` (semantic-release --dry-run) which computes
# the next version from the conventional-commit history and surfaces it in the
# job summary. Merges are squash-only with a blank body, so each commit in the
# range is one PR whose title alone sets the bump (ADR-0029). If a release is
# due, `release` runs the real semantic-release unattended: it creates
# and pushes the tag, and nothing else. Because the tag is pushed with a GitHub
# App token (NOT the default GITHUB_TOKEN, whose events do not trigger other
# workflows), `oci-publish.yml` (on: push tags 'v*') fires and is the sole
# creator of the GitHub Release object — it is the only place the release assets
# exist, and an immutable release can only receive them before it is published.
# That is why `.releaserc.json` carries no `@semantic-release/github` plugin:
# the plugin published an asset-less release the moment it tagged, and every
# later upload was refused with HTTP 422 (#251). semantic-release does NOT
# commit back to `main`; CHANGELOG.md is cut by hand in the releasing PR
# (ADR-0020).
#
# See knowledge/workflows/release-process.md for the full design and the one-time
# GitHub App setup.

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false # never cancel a half-done release

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # dry-run only — semantic-release's own verifyAuth runs
      # `git push --dry-run` even under --dry-run (semantic-release/index.js),
      # so a read-only token fails the plan before it computes anything.
      # GITHUB_TOKEN cannot push to protected main nor trigger downstream
      # workflows, so it cannot cut a real release from this ungated job.
    timeout-minutes: 15
    outputs:
      will-release: ${{ steps.dry.outputs.will-release }}
      next-version: ${{ steps.dry.outputs.next-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history + tags for semantic-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Dry-run semantic-release (compute next version)
        id: dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          npx semantic-release --dry-run > sr-dry.log 2>&1
          rc=$?
          set -e
          cat sr-dry.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::semantic-release --dry-run exited $rc (see log above)"
            exit "$rc"
          fi
          # semantic-release logs "The next release version is X.Y.Z" (and a
          # "...the next release version is X.Y.Z" first-release variant) —
          # match case-insensitively and take the version token.
          #
          # head -1, NOT tail -1: release-notes-generator prints the notes, which
          # embed contributor commit subjects, AFTER the version line. Under
          # tail -1 a PR title containing this sentence would supply the
          # version the release job then ships. The real line is
          # emitted during analyzeCommits, so the first match is it.
          version="$(grep -ioE 'the next release version is [0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?' sr-dry.log | awk '{print $NF}' | head -1 || true)"
          {
            echo "# Release plan"
            if [ -n "$version" ]; then
              echo "**Next version:** \`v${version}\`"
              echo "will-release=true" >> "$GITHUB_OUTPUT"
              echo "next-version=${version}" >> "$GITHUB_OUTPUT"
            else
              echo "**No release** — no relevant changes since the last tag."
              echo "will-release=false" >> "$GITHUB_OUTPUT"
              echo "next-version=" >> "$GITHUB_OUTPUT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: ${{ needs.plan.outputs.will-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the App token performs writes, not GITHUB_TOKEN
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false # force semantic-release to use the App token for the tag push
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # This job recomputes the version `plan` reported. Nothing else binds the
      # two, so a divergence would ship a version nobody saw planned.
      - name: Assert the planned version is the version about to ship
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PLANNED: ${{ needs.plan.outputs.next-version }}
        run: |
          set -euo pipefail
          npx semantic-release --dry-run > sr-confirm.log 2>&1 || true
          actual="$(grep -ioE 'the next release version is [0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?' sr-confirm.log | awk '{print $NF}' | head -1 || true)"
          if [ "$actual" != "$PLANNED" ]; then
            echo "::error::the release job computes v${actual:-<none>} but plan computed v${PLANNED}; refusing to publish a version that was not planned"
            exit 1
          fi
          echo "OK: v${actual} matches the plan"

      - name: semantic-release
        env:
          # App token (NOT GITHUB_TOKEN) so the tag push triggers oci-publish.yml.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

  # A failed automated release is otherwise silent unless someone watches the
  # Actions tab. ONE tracking issue, updated, rather than a new one per push.
  #
  # Two disjuncts: a `plan` that dies (npm, the dry-run) leaves `release`
  # SKIPPED rather than failed, so the release result alone misses it.
  #
  # The body is a fixed sentence plus the run URL and carries NO diff-derived
  # text: commit subjects are contributor-chosen, this job holds
  # `issues: write`, and AGENTS.md §Session-Start Ritual tells agents to read the
  # tracker. Everything variable is env-bound, never interpolated into `run:`.
  notify:
    needs: [plan, release]
    if: >-
      ${{ always() && (
        needs.plan.result == 'failure' ||
        needs.release.result == 'failure'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the release-blocked tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "release: the automated release is not completing"
        run: |
          set -euo pipefail
          # The LIST api, not --search: the search index lags, so two queued
          # blocked pushes would each miss the other's issue and file a
          # duplicate. The author filter keeps a same-titled issue opened by
          # anyone else from capturing the alert.
          existing="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE) | select(.author.login == "github-actions")] | .[].number')"
          body() {
            printf '%s\n\n%s\n' \
              "The Release workflow did not complete. The run log carries the cause: $RUN_URL" \
              "Recovery: knowledge/workflows/release-process.md, section \"When the release is blocked\"."
          }
          if [ -n "$existing" ]; then
            printf '%s\n' "$existing" | while IFS= read -r n; do
              [ -n "$n" ] || continue
              body | gh issue comment "$n" --repo "$REPO" --body-file - || true
            done
          else
            body | gh issue create --repo "$REPO" --title "$TITLE" \
              --label 'kind: ci' --label 'area: ci' --body-file -
          fi

  # The mirror of `notify`: a run that actually released closes the tracking
  # issue, so a permanently-open alert cannot train the operator to ignore it.
  # A human close means "start a fresh record", hence the state:open lookup.
  notify-resolved:
    needs: [plan, release]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the release-blocked tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "release: the automated release is not completing"
        run: |
          set -euo pipefail
          # The LIST api, not --search: the search index lags, so two queued
          # blocked pushes would each miss the other's issue and file a
          # duplicate. The author filter keeps a same-titled issue opened by
          # anyone else from capturing the alert.
          existing="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE) | select(.author.login == "github-actions")] | .[].number')"
          [ -n "$existing" ] || { echo "no open tracking issue"; exit 0; }
          # Every match, not just the first: a duplicate left open is the alert
          # fatigue this job exists to prevent. `|| true` so a race with a human
          # closing the issue cannot red an otherwise successful release.
          printf '%s\n' "$existing" | while IFS= read -r n; do
            [ -n "$n" ] || continue
            # "tagged", not "released": since #251 this workflow only pushes the
            # tag, and whether the artifact and its GitHub Release followed is
            # oci-publish.yml's own tracking issue to answer.
            printf '%s' "A release tag was pushed: $RUN_URL" \
              | gh issue comment "$n" --repo "$REPO" --body-file - || true
            gh issue close "$n" --repo "$REPO" --reason completed || true
          done
