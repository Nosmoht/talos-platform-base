name: Release

# Conventional-commit-driven, fully automated releases — no human approval step.
#
# Flow: a push to `main` runs `plan` (semantic-release --dry-run) which computes
# the next version from the conventional-commit history and surfaces it in the
# job summary. `plan` also runs a blocking MAJOR-bump guard (see the step) — the
# backstop that replaced the former manual approval. If a release is due and the
# guard passes, `release` runs the real semantic-release unattended: it creates
# the tag + GitHub Release. Because the tag is pushed with a GitHub App token
# (NOT the default GITHUB_TOKEN, whose events do not trigger other workflows),
# the existing `oci-publish.yml` (on: push tags 'v*') fires and attaches the
# cosign-signed OCI assets to the Release. oci-publish.yml is unchanged, so the
# signing identity + consumer verification regex are preserved. semantic-release
# does NOT commit back to `main`; CHANGELOG.md is cut by hand in the releasing PR
# (ADR-0020).
#
# See knowledge/workflows/release-process.md for the full design, the one-time GitHub App
# setup, and the commit-message (BREAKING CHANGE footer) discipline.

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false # never cancel a half-done release

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # dry-run only — satisfies @semantic-release/github verifyConditions.
      # GITHUB_TOKEN cannot push to protected main nor trigger downstream
      # workflows, so it cannot cut a real release from this ungated job.
    timeout-minutes: 15
    outputs:
      will-release: ${{ steps.dry.outputs.will-release }}
      next-version: ${{ steps.dry.outputs.next-version }}
      # Empty unless the guard reached a verdict. `notify` gates on this rather
      # than on the job result: most `plan` failures are npm/registry noise, and
      # a guard-shaped tracking issue must not collect them.
      guard-verdict: ${{ steps.guard.outputs.guard-verdict }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history + tags for semantic-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Dry-run semantic-release (compute next version)
        id: dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          npx semantic-release --dry-run > sr-dry.log 2>&1
          rc=$?
          set -e
          cat sr-dry.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::semantic-release --dry-run exited $rc (see log above)"
            exit "$rc"
          fi
          # semantic-release logs "The next release version is X.Y.Z" (and a
          # "...the next release version is X.Y.Z" first-release variant) —
          # match case-insensitively and take the version token.
          version="$(grep -ioE 'the next release version is [0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?' sr-dry.log | awk '{print $NF}' | tail -1 || true)"
          {
            echo "# Release plan"
            if [ -n "$version" ]; then
              echo "**Next version:** \`v${version}\`"
              echo "will-release=true" >> "$GITHUB_OUTPUT"
              echo "next-version=${version}" >> "$GITHUB_OUTPUT"
            else
              echo "**No release** — no relevant changes since the last tag."
              echo "will-release=false" >> "$GITHUB_OUTPUT"
              echo "next-version=" >> "$GITHUB_OUTPUT"
            fi
            # Breaking-change prompt (AGENTS.md: a base Helm-value breaking
            # change requires a MAJOR bump). semantic-release only bumps MAJOR on
            # a `BREAKING CHANGE:` footer / `type!:` -- prose "BREAKING" is
            # ignored. This block is INFORMATIONAL and fires on every push; the
            # blocking guard below is gated on will-release, so a non-releasing
            # push that parks a surface change on main is visible only here.
            #
            # The surface set is read from .ci-release-guard-pathspec.txt via the
            # same parser the guard uses -- a second copy of the globs here is
            # what let this prompt and the guard disagree (#234). Tag selection is
            # the guard's rule too, not `git describe`, which returns the nearest
            # REACHABLE tag and diverges from what the guard decides on.
            set -f
            . ./scripts/release-guard-lib.sh
            rg_load_pathspec
            set +f
            last_tag="$(git tag --list 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -n "$last_tag" ]; then
              surface="$(git -c core.ignoreCase=false diff --name-only \
                "${last_tag}..HEAD" -- "${RG_PATHSPEC[@]}" || true)"
              if [ -n "$surface" ]; then
                echo ""
                echo "> **Guarded base surface changed since \`${last_tag}\`** -- confirm the computed version above is MAJOR if a published contract, layout or Helm-value default moved. A squash-merge strips \`type!:\` subjects of branch commits; the marker must survive on the mainline commit."
                echo ""
                echo "Changed guarded files:"
                echo '```'
                printf '%s\n' "$surface" | while IFS= read -r f; do printf '  %s\n' "$f"; done
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Hard MAJOR-bump guard -- the backstop that replaced the removed manual
      # approval Environment (ADR-0020 §Decision 3). The logic lives in
      # scripts/release-major-bump-guard.sh so it is runnable locally and bound
      # by scripts/check-release-guard-gate-bites.sh; the guarded set lives in
      # .ci-release-guard-pathspec.txt with its membership rule. Do not inline
      # either back into this file -- check-release-guard-coverage.sh fails if a
      # `git diff --name-only` reappears here, and neither `--base` nor
      # `--advisory` may be added to the invocation below: each neuters the gate.
      # Gated on will-release so a non-releasing push (docs/chore) never fails.
      - name: MAJOR-bump guard
        id: guard
        if: steps.dry.outputs.will-release == 'true'
        env:
          NEXT: ${{ steps.dry.outputs.next-version }}
        run: ./scripts/release-major-bump-guard.sh

  release:
    needs: plan
    if: ${{ needs.plan.outputs.will-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the App token performs writes, not GITHUB_TOKEN
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false # force semantic-release to use the App token for the tag push
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: semantic-release
        env:
          # App token (NOT GITHUB_TOKEN) so the tag push triggers oci-publish.yml.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

  # A failed automated release is silent unless someone watches the Actions tab
  # (ADR-0020 §Consequences listed a notification as follow-up). This job is that
  # follow-up: it files ONE tracking issue and updates it, rather than a new one
  # per push.
  #
  # Gated on the guard's own verdict, not on `needs.plan.result`: most `plan`
  # failures are npm/registry noise and would fill a guard-shaped issue with
  # unrelated infrastructure errors. `release` failures are covered separately --
  # an expired App key produces the same user-visible outcome as a block.
  #
  # The body is a fixed sentence plus the run URL and carries NO diff-derived
  # text: the guard's surface list is contributor-chosen filenames, this job
  # holds `issues: write`, and AGENTS.md §Session-Start Ritual tells agents to
  # read the tracker. Everything variable is env-bound, never interpolated into
  # `run:` (the convention docs-lint.yml documents for the same class).
  notify:
    needs: [plan, release]
    if: >-
      ${{ always() && (
        startsWith(needs.plan.outputs.guard-verdict, 'guard blocked') ||
        startsWith(needs.plan.outputs.guard-verdict, 'guard error') ||
        needs.release.result == 'failure'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the release-blocked tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "release: the automated release is not completing"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"
          body() {
            printf '%s\n\n%s\n' \
              "The Release workflow did not complete. The run log carries the guard's verdict and the surface list: $RUN_URL" \
              "Recovery: knowledge/workflows/release-process.md, section \"When the release is blocked\". Filenames are deliberately not reproduced here."
          }
          if [ -n "$existing" ]; then
            body | gh issue comment "$existing" --repo "$REPO" --body-file -
          else
            body | gh issue create --repo "$REPO" --title "$TITLE" \
              --label 'status: ready' --label 'kind: ci' --label 'area: ci' --body-file -
          fi

  # The mirror of `notify`: a run that actually released closes the tracking
  # issue, so a permanently-open alert cannot train the operator to ignore it.
  # A human close means "start a fresh record" -- the lookup is state:open only.
  notify-resolved:
    needs: [plan, release]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the release-blocked tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "release: the automated release is not completing"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"
          [ -n "$existing" ] || { echo "no open tracking issue"; exit 0; }
          printf '%s' "A release completed: $RUN_URL" \
            | gh issue comment "$existing" --repo "$REPO" --body-file -
          gh issue close "$existing" --repo "$REPO" --reason completed
