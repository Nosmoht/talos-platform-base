name: image-factory-live

# Checks the provisioning catalog's extension names against the live Talos
# Image Factory. Kept out of tofu-validate.yml so a factory.talos.dev outage
# reds this workflow only, never the module's regression suite. A red run means
# the Factory is unreachable or has renamed a package — re-run it, or fix the
# catalog name in profiles.tf. Advisory; not a required check.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  pull_request:
    branches:
      - main
    paths:
      - 'tofu/modules/talos-cluster/profiles.tf'
      - 'tofu/modules/talos-cluster/image-factory.tf'
      - 'tofu/modules/talos-cluster/.terraform.lock.hcl'
      - 'tofu/modules/talos-cluster/tests/live/**'
      - '.github/workflows/image-factory-live.yml'

permissions:
  contents: read

jobs:
  image-factory-catalog:
    name: image-factory-catalog (live upstream, not a module regression)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.12.1'
          tofu_wrapper: false

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.53.1  # KEEP IN SYNC with the task pin in .tool-versions
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task tofu:test:image-factory
        run: task tofu:test:image-factory
