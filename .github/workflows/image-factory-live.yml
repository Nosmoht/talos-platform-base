name: image-factory-live

# Kept out of tofu-validate.yml so a factory.talos.dev outage reds this
# workflow only, never the module's regression suite. Advisory; not a required
# check.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  pull_request:
    branches:
      - main
    paths:
      - 'tofu/modules/talos-cluster/profiles.tf'
      - 'tofu/modules/talos-cluster/image-factory.tf'
      - 'tofu/modules/talos-cluster/composition.tf'
      - 'tofu/modules/talos-cluster/main.tf'
      - 'tofu/modules/talos-cluster/.terraform.lock.hcl'
      - 'tofu/modules/talos-cluster/tests/live/**'
      - '.github/workflows/image-factory-live.yml'
      - 'Taskfile.yml'
      - 'mise.toml'
      - 'mise.lock'

permissions:
  contents: read

jobs:
  image-factory-catalog:
    name: image-factory-catalog (live Talos Image Factory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: task tofu:test:image-factory
        run: task tofu:test:image-factory
