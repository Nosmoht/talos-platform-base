name: Vale prose linter

on:
  pull_request:
    paths:
      - "*.md"
      - ".vale.ini"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/vale.yml"
  push:
    branches: [main]
    paths:
      - "*.md"
      - ".vale.ini"
      - "mise.toml"
      - "mise.lock"

permissions:
  contents: read

jobs:
  vale:
    name: Vale + Google Developer Documentation Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: aqua:vale-cli/vale

      - name: Vale sync (fetch Google style package)
        # mkdir is required: vale sync writes to StylesPath but does not
        # create the directory itself (Vale 3.14.2 behaviour). Local
        # developers usually have it already from a prior `vale sync`;
        # CI starts from a clean checkout.
        run: |
          mkdir -p .vale/styles
          vale sync

      - name: Vale lint (root-level docs)
        # Scope matches .vale.ini's section glob — root-level Markdown
        # files only for the initial pass. Widening to knowledge/** is a
        # follow-up once the existing corpus is consistent.
        run: |
          vale --no-wrap --output=line \
            README.md \
            ARCHITECTURE.md \
            AGENTS.md \
            CONTRIBUTING.md \
            SECURITY.md \
            MAINTAINERS.md \
            UPGRADING.md \
            CHANGELOG.md
