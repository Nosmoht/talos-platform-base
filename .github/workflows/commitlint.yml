name: Commit Lint

# Conventional-commit gate on the PR TITLE.
#
# NOT because the title becomes the mainline commit subject: with
# merge_commit_title=MERGE_MESSAGE the subject is "Merge pull request #N from …"
# and the release type comes from the branch commits preserved in the range.
# What linting the title buys:
#   * merge_commit_message=PR_TITLE puts the title in the merge commit BODY, so
#     an unconstrained title is a line the release guard reads. The closed type
#     list below keeps `Allow-Non-Major: …` out of it — which makes this check a
#     premise of the guard rather than house style.
#   * it is the subject readers see in the PR list and in `git log --oneline`.
#   * it is where the `!` breaking-change marker is caught before merge.
# `requireScope: false`: scope is a soft house-style preference per CONTRIBUTING.md,
# not mandatory (scope-less subjects like `docs: fix typo` are valid).
# Note: this gates PRs only; direct-main commits bypass it (repo convention is
# PR-merged). The release approval gate is the backstop. See knowledge/workflows/release-process.md.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr-title:
    # MUST stay "lint-pr-title": that is the context branch protection is to
    # require (ADR-0020 §Amendment, not yet applied), and GitHub derives it from
    # name:, so riding the job-id fallback would let a rename silently un-gate
    # the check. scripts/preflight-checks.sh Check 1 asserts both.
    name: lint-pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            chore
            docs
            test
            refactor
            ci
          requireScope: false
