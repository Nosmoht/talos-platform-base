name: Commit Lint

# Conventional-commit gate on the PR TITLE.
#
# Merges are squash-only with squash_merge_commit_title=PR_TITLE and a blank
# body, so the title is the subject on `main` and the only input to the
# release bump (ADR-0029). Linting it is what makes that input well-formed.
# `requireScope: false`: scope is a soft house-style preference per CONTRIBUTING.md,
# not mandatory (scope-less subjects like `docs: fix typo` are valid).
# Note: this gates PRs only; direct-main commits bypass it (repo convention is
# PR-merged). See knowledge/workflows/release-process.md.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr-title:
    # MUST stay "lint-pr-title": that is the context branch protection is to
    # require (ADR-0020 §Amendment), and GitHub derives it from
    # name:, so riding the job-id fallback would let a rename silently un-gate
    # the check. scripts/preflight-checks.sh Check 1 asserts both.
    name: lint-pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            chore
            docs
            test
            refactor
            ci
          requireScope: false
