name: Commit Lint

# Conventional-commit gate on the PR TITLE. Squash-merge uses the PR title as
# the resulting commit subject on main, which is what semantic-release parses to
# compute the next release — so the PR title is the correct thing to lint.
# `requireScope: false`: scope is a soft house-style preference per CONTRIBUTING.md,
# not mandatory (scope-less subjects like `docs: fix typo` are valid).
# Note: this gates PRs only; direct-main commits bypass it (repo convention is
# PR-merged). The release approval gate is the backstop. See knowledge/workflows/release-process.md.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            chore
            docs
            test
            refactor
            ci
          requireScope: false
