# Integrity lock for the release guard's data files.
#
# scripts/check-release-guard-gate-bites.sh verifies this before running any
# scenario, because its scenarios are GENERATED from those files: an entry
# removed there would remove its own test and the suite would stay green. The
# lock makes a narrowing a two-file edit -- the entry and its digest -- instead
# of a one-file pattern tightening.
#
# It is a speed bump, not a gate: CODEOWNERS is documented in this repo as
# non-enforcing (see its header). The external anchor is
# scripts/check-release-guard-coverage.sh, which reads .ci-oci-tarball-expected.txt.
#
# Regenerate deliberately, never reflexively:
#   task supply-chain:relock-release-guard
