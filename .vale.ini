; Vale 3.x configuration for talos-platform-base.
; Spec: https://vale.sh/docs/topics/config
; Style:  https://developers.google.com/style (Google Developer Documentation Style)
;
; Scope: operator-facing documentation at repo root.
; The knowledge/ bundle is excluded for the initial pass because the
; corpus (decision records, references, workflows) would surface hundreds
; of findings on a first run; a follow-up PR will widen scope once
; root-level docs are clean.
;
; AlertLevel = "error" only — suggestion / warning are advisory and not
; CI-blocking. Promote a rule from suggestion → error in follow-up PRs
; once the corpus is consistent.

StylesPath = .vale/styles

; Auto-fetch Google style + Vale's built-in basics on `vale sync`.
Packages = https://github.com/errata-ai/Google/releases/latest/download/Google.zip

MinAlertLevel = error

; Scope: top-level Markdown in repo root only for the initial pass.
[{README,ARCHITECTURE,AGENTS,CONTRIBUTING,SECURITY,MAINTAINERS,UPGRADING,CHANGELOG}.md]
BasedOnStyles = Vale, Google

; Vale built-in rules — keep restrictive.
Vale.Avoid             = error
Vale.Repetition        = error
Vale.Spelling          = NO   ; off — terminology is heavily Talos/Kubernetes/Cilium-specific; project glossary, not Vale, is the authority
Vale.Terms             = NO   ; same reason

; Google rules — opt out of those that conflict with established
; project conventions, keep those that catch real prose defects.
; Every NO has a one-line reason; future tightening converts NO → error
; once the corpus is consistent.
;
; KEPT (error, blocking):
Google.Latin           = error    ; "e.g." / "i.e." / "etc." → English equivalents
Google.Periods         = error    ; consistent terminal punctuation
Google.Quotes          = error    ; straight quotes only
Google.Slang           = error    ; no jargon-as-prose
Google.We              = error    ; documentation should be subject-explicit
;
; DROPPED (project convention conflicts with Google default):
Google.Acronyms        = NO       ; tolerate TLS/OIDC/CCNP/CNP/PNI/SLSA/SBOM unexpanded
Google.Headings        = NO       ; project uses descriptive Title Case in many places
Google.EmDash          = NO       ; project convention: em-dash with surrounding spaces
Google.LyHyphens       = NO       ; technical compound nouns (supply-chain, capability-first) keep hyphens
Google.Spelling        = NO       ; mix of US/UK is tolerated; knowledge/glossary.md is the authority
Google.Units           = NO       ; "Helm value" / "values.yaml" are nouns, not unit-measured quantities
Google.WordList        = NO       ; "above / below / on" navigational language is project convention
Google.Will            = NO       ; tolerate "will" for forward-looking architectural language
