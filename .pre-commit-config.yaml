repos:
  - repo: local
    hooks:
      - id: codex-config-placeholder-only
        name: Ensure .codex/config.toml uses only ${VAR} placeholders in env blocks
        entry: bash scripts/check-codex-config-placeholders.sh
        language: system
        files: '^\.codex/config\.toml$'
        pass_filenames: false

      - id: check-mcp-config-portable
        name: MCP configs must use bare PATH commands (no absolute paths or variables)
        entry: sh scripts/check-mcp-config-portable.sh
        language: system
        files: '^(\.mcp\.json|\.codex/config\.toml)$'
        pass_filenames: false

      - id: shellcheck
        name: ShellCheck (-S warning) on shell scripts
        entry: shellcheck -S warning
        language: system
        files: '\.sh$'

      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks from mise.toml)
        # Same entry as upstream's hook, run on the mise-pinned binary so
        # pre-commit and CI scan with one version. --config shares
        # .gitleaks.toml with the CI scan.
        entry: gitleaks git --pre-commit --redact --staged --verbose --config=.gitleaks.toml
        language: system
        pass_filenames: false
