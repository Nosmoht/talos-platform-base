# Homelab cluster definition — the declarative SoT consumed by the OpenTofu
# shim in main.tf (yamldecode). Mixed amd64 + arm64 topology:
#   3 controlplane (intel) · 4 kubevirt workers (intel) · 1 GPU worker (intel) ·
#   1 Raspberry-Pi worker (arm64).
#
# Kubernetes roles are ONLY controlplane / worker; storage / compute-virt / GPU
# are composable hardware_capabilities, NOT roles. A node holds a SET of
# capabilities (e.g. storage + virt). The arm64 Pi worker is the case the
# pre-composition module could not express. IPs are RFC5737 documentation
# addresses (192.0.2.0/24) — a tofu validate/plan fixture, not a runnable apply.

cluster:
  name: homelab
  endpoint: https://192.0.2.1:6443
  overlay: homelab
  target_revision: main

repo:
  url: https://github.com/your-org/homelab.git

talos:
  version: v1.12.6 # schema pin (fixed at bootstrap)
  install_version: v1.12.7 # installer tag bumped for an OS upgrade (exercises the split)
kubernetes:
  version: v1.35.0

# Base images — the non-composable axis: arch + CPU vendor + BASELINE extensions
# baked on every node of the image regardless of capabilities (CPU microcode,
# GPU/NIC firmware, base tooling, default runtime sandbox). drbd + nvidia are
# capabilities, not baseline, so they are NOT listed here.
images:
  intel:
    architecture: amd64
    cpu_vendor: intel
    extensions:
      - siderolabs/gvisor
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/nvme-cli
  intel-gpu: # the GPU node additionally carries Realtek NIC firmware
    architecture: amd64
    cpu_vendor: intel
    extensions:
      - siderolabs/gvisor
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/nvme-cli
      - siderolabs/realtek-firmware
  rpi:
    architecture: arm64
    cpu_vendor: arm
    extensions: [] # the RPi schematic carries the board overlay, not extensions
    overlay:
      name: rpi_generic
      image: siderolabs/sbc-raspberrypi

# Composite hardware-capabilities (tool-agnostic; resolve to base catalog
# profiles). requires_features (scheduling/labels) and provisioning_profiles
# (what to bake) are SEPARATE lists.
hardware-capabilities:
  storage-replicated:
    requires_features: [drbd-kernel-module]
    provisioning_profiles: [drbd]
    emits_label: platform.io/hardware-capability.storage-replicated
  compute-virt-passthrough: # KubeVirt + PCI passthrough; IOMMU now actually bakes (the v1.10+ fix)
    # vt-x-or-amd-v and kvm-kernel-module are NFD-DETECTED atoms (no profile): KVM
    # is in-kernel and auto-loads on VMX/SVM-capable hardware, so only iommu-enabled
    # is provisioned here. They stay in requires_features for scheduling/labels.
    requires_features: [vt-x-or-amd-v, kvm-kernel-module, iommu-enabled]
    provisioning_profiles: [iommu] # provides iommu-enabled (symmetry); vendor-resolved to intel_iommu via the image cpu_vendor
    emits_label: platform.io/hardware-capability.compute-virt-passthrough
  compute-gpu-nvidia: # plain device-plugin GPU (NOT passthrough): no iommu. A vfio
    # passthrough GPU would additionally list iommu-enabled + the iommu profile.
    requires_features: [nvidia-gpu] # NFD-detected presence atom (no profile provisions it)
    provisioning_profiles: [nvidia-lts]
    emits_label: platform.io/hardware-capability.compute-gpu-nvidia

nodes:
  - { hostname: node-cp-1, ip: 192.0.2.11, role: controlplane, image: intel, hardware_capabilities: [storage-replicated] }
  - { hostname: node-cp-2, ip: 192.0.2.12, role: controlplane, image: intel, hardware_capabilities: [storage-replicated] }
  - { hostname: node-cp-3, ip: 192.0.2.13, role: controlplane, image: intel, hardware_capabilities: [storage-replicated] }
  - { hostname: node-w-1, ip: 192.0.2.21, role: worker, image: intel, hardware_capabilities: [storage-replicated, compute-virt-passthrough] }
  - { hostname: node-w-2, ip: 192.0.2.22, role: worker, image: intel, hardware_capabilities: [storage-replicated, compute-virt-passthrough] }
  - { hostname: node-w-3, ip: 192.0.2.23, role: worker, image: intel, hardware_capabilities: [storage-replicated, compute-virt-passthrough] }
  - { hostname: node-w-4, ip: 192.0.2.24, role: worker, image: intel, hardware_capabilities: [storage-replicated, compute-virt-passthrough] }
  - hostname: node-gpu-1
    ip: 192.0.2.31
    role: worker
    image: intel-gpu
    hardware_capabilities: [storage-replicated, compute-gpu-nvidia]
    config_patches:
      # per-node NIC binding (the value the old ${NIC_NAME} placeholder carried)
      - machine: { network: { interfaces: [{ interface: enp0s20f0u2, dhcp: true }] } }
  - { hostname: node-pi-1, ip: 192.0.2.41, role: worker, image: rpi, hardware_capabilities: [] }

# Cluster-wide patches the caller owns (NTP here; the module injects none).
config_patches:
  - machine: { time: { servers: ["192.0.2.123"] } }

# Role tier — applied to controlplane nodes only (exercises the role pass).
controlplane_config_patches:
  - cluster: { apiServer: { extraArgs: { event-ttl: "1h0m0s" } } }

# Substrate: Cilium + ArgoCD delivered by the module (Layer-1 floor). Defaults
# are shown explicitly; secrets (sops_age_key, cilium_ipsec_key) come from
# tfvar/env via variables.tf, NEVER from this file.
substrate:
  cilium:
    enabled: true
  argocd:
    enabled: true
