# Bootstrap Helm values for delivering ArgoCD via a Talos inlineManifest
# (data.helm_template.argocd → cluster.inlineManifests, rendered locally).
#
# DELIBERATELY slim: only what ArgoCD needs at cluster bootstrap to come alive
# and decrypt SOPS. The rest arrives later, and from two different places: the
# steady-state component (kubernetes/substrate/argocd) carries the base
# configuration via ArgoCD self-management, while SSO and RBAC are a CONSUMER
# contract — patched onto the argocd-cm / argocd-rbac-cm ConfigMaps in the
# consumer's own kustomize overlay, never set here. NO server.certificate
# either, because the ClusterIssuer does not exist yet at bootstrap.
#
# A consumer can replace this wholesale via var.argocd_values_override.

# CRDs are NOT rendered into the inlineManifest: the three ArgoCD CRDs
# (Application/ApplicationSet/AppProject) are ~1.8 MB and blow the Talos
# inlineManifest size budget (the app itself is only ~109 KB). The module
# applies the CRDs separately via kubectl server-side after the health gate
# (see null_resource.argocd_crds in main.tf). Server-side apply also avoids the
# >262 KB client-side last-applied-config annotation limit the ApplicationSet
# CRD trips.
crds:
  install: false

server:
  service:
    type: ClusterIP

# Substrate invariant: the bundled Dex server stays OFF here too, matching the
# steady-state render. Consumers wire ArgoCD SSO against their own external OIDC
# provider by patching the `oidc.config` key of the `argocd-cm` ConfigMap in a
# kustomize overlay — NOT through these Helm values, which a consumer of the
# published component never has. So the chart-default dex-server is a
# connector-less idle workload — and even in the slim bootstrap seed it would
# bloat the Talos inlineManifest. Mirrors kubernetes/substrate/argocd/values.yaml.
# The CI gate scripts/check-argocd-substrate-invariants.sh asserts this across
# both paths; see that component's README §Substrate invariants.
dex:
  enabled: false

# ksops in the repoServer — so ArgoCD can decrypt SOPS-encrypted manifests
# (runtime secrets, ADR-0023 class B). The age key comes from the sops-age-key
# Secret (created by the module as an inlineManifest from var.sops_age_key,
# same namespace).
repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age-key
  volumeMounts:
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /sops-age
      readOnly: true
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.3.2
      command: ["/bin/sh", "-c"]
      args:
        - cp /usr/local/bin/ksops /custom-tools/
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools

configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
    # Deliberately EMPTY, not unset: the chart derives configs.cm.url from
    # global.domain, whose default is a placeholder hostname. ArgoCD documents
    # `url` as required for SSO and derives the OIDC redirect URI from it, so a
    # placeholder does not fail loudly — it fails at the IdP with a redirect-URI
    # mismatch, long after the operator stopped looking. An empty string wins the
    # chart's merge and drops the key from argocd-cm entirely, so an unconfigured
    # cluster is visibly unconfigured. The consumer supplies the real value in
    # their overlay. (`global.domain: ""` is NOT the lever: it yields a broken
    # literal `https://` in argocd-cm AND argocd-notifications-cm.)
    url: ""
  params:
    # Bootstrap-insecure (TLS via Gateway/cert-manager in the steady state).
    server.insecure: "true"
