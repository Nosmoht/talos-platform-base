# GOLDEN — the SINGLE-SOURCE emitted Cilium Application, byte for byte.
#
# Why it exists: the values-source input of issue #265 makes the module emit two
# different manifest schemas, and the promise is that SETTING OR LEAVING UNSET
# `cilium_self_management_values_source`, at one base revision, does not move the
# single-source document. Presence and absence assertions cannot carry that — a
# field added, renamed or reordered anywhere else satisfies every one of them.
#
# PROVENANCE: the baseline moved DELIBERATELY at issue #270, which added
# `rollOutCiliumPods: true` to helm/cilium-values.yaml so a Day-2 values change
# reaches the running agents. Before that, this file was captured at the commit
# preceding the values-source change and was evidence about the PREVIOUS release;
# it is no longer. It is now a change-detector for byte moves in the single-source
# document, captured from this tree — which is why the named per-key assertions in
# tests/input-validation.tftest.hcl, and not this file, are what state the facts.
#
# Input set (tests/input-validation.tftest.hcl, run
# "cilium_self_management_single_source_arm_is_unchanged"): the file's global
# variables block plus cilium_self_management / deploy_argocd / deploy_cilium
# true and NO cilium_self_management_values_source. Everything else is a module
# default, so a changed default moves this file — which is the point.
#
# When it fails: a byte moved. Decide DELIBERATELY whether that is a
# consumer-visible manifest change (then it belongs in CHANGELOG/UPGRADING and
# the next MAJOR) before refreshing the fixture. Do not regenerate it to get
# green — the same rule as tests/fixtures/cilium-config-keys.txt.
"apiVersion": "argoproj.io/v1alpha1"
"kind": "Application"
"metadata":
  "labels":
    "app.kubernetes.io/component": "cni"
    "app.kubernetes.io/instance": "cilium"
    "app.kubernetes.io/managed-by": "argocd"
    "app.kubernetes.io/name": "cilium"
    "app.kubernetes.io/part-of": "talos-platform-base"
    "app.kubernetes.io/version": "1.20.0"
  "name": "cilium"
  "namespace": "argocd"
"spec":
  "destination":
    "namespace": "kube-system"
    "server": "https://kubernetes.default.svc"
  "project": "default"
  "source":
    "chart": "cilium"
    "helm":
      "valuesObject":
        "cgroup":
          "autoMount":
            "enabled": false
          "hostRoot": "/sys/fs/cgroup"
        "cni":
          "exclusive": false
        "gatewayAPI":
          "enableAppProtocol": true
          "enabled": true
        "hubble":
          "enabled": false
        "ipam":
          "mode": "kubernetes"
        "k8sServiceHost": "localhost"
        "k8sServicePort": "7445"
        "kubeProxyReplacement": true
        "operator":
          "replicas": 1
        "rollOutCiliumPods": true
        "routingMode": "tunnel"
        "securityContext":
          "capabilities":
            "ciliumAgent":
            - "CHOWN"
            - "KILL"
            - "NET_ADMIN"
            - "NET_RAW"
            - "NET_BIND_SERVICE"
            - "IPC_LOCK"
            - "SYS_ADMIN"
            - "SYS_RESOURCE"
            - "DAC_OVERRIDE"
            - "FOWNER"
            - "SETGID"
            - "SETUID"
            "cleanCiliumState":
            - "NET_ADMIN"
            - "SYS_ADMIN"
            - "SYS_RESOURCE"
    "repoURL": "https://helm.cilium.io"
    "targetRevision": "1.20.0"
