  - id: gpu-runtime
    name: NVIDIA GPU scheduling and telemetry
    description: |
      GPU device-plugin + DCGM telemetry. Schedules GPU resources via
      the NVIDIA device plugin and surfaces per-GPU utilization metrics
      via DCGM exporter. Node-feature discovery (NFD) is Layer-C
      producer-tooling (see adr-three-layer-capability-architecture.md);
      it discovers the hardware predicate but is not part of this
      capability's composition.
    domain: {layer: runtime, category: "Container Runtime"}
    stability: beta
    deployment_topology: tenant-instance
    contract: |
      Node-local device-plugin socket + DCGM metrics exporter
      on host-network.
    requires_hardware_features: [nvidia-gpu, iommu-enabled]
    independence_test:
      alt_impls_exist: false
      contract_stable: true
      independent_lifecycle: true
      notes: |
        Single implementation by NVIDIA-scope: name, contract, and
        requires_hardware_features ([nvidia-gpu, iommu-enabled]) all
        pin this entry to NVIDIA hardware. AMD ROCm and Intel Gaudi
        would be sibling Layer-A capabilities (`gpu-runtime-amd`,
        `gpu-runtime-intel`) with disjoint `requires_hardware_features`,
        NOT alt-impls of this entry. Per Round-1 review (reviewer
        HIGH, .work/reviews/r1/reviewer.md) the earlier post-NFD-removal
        flip to `true` was overcorrection. NFD removal correctly
        flipped `independent_lifecycle` to true (device-plugin and
        DCGM-exporter have separate version trains); `alt_impls_exist`
        stays false honestly.
    implementations:
      - name: nvidia-stack
        status: active
        composition: [nvidia-device-plugin, nvidia-dcgm-exporter]
        swap_class: rewrite-required
    pni_capability_id: gpu-runtime
    references: ["https://github.com/NVIDIA/k8s-device-plugin"]
    kind: tool-capability
